name: Data Center Turkish Voice Trials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Generate and validate three Turkish voice trials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python datacenter/narration/generate_voice_trials.py

      - name: Upload trial audio bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datacenter-turkish-voice-trials
          path: datacenter/audio/trials/tr/
          if-no-files-found: error
          retention-days: 14
