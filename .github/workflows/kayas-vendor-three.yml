name: Vendor Offline Three.js for KAYAS Walkthrough

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-vendor-three.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-vendor-three
  cancel-in-progress: false

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified single-file KAYAS source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1Y_P2iS8zqqKVtrXHY2ZteyBxSPGMjHCz' \
            -o /tmp/KAYAS_3D_Model_v5_Single_File_H3C.html
          test -s /tmp/KAYAS_3D_Model_v5_Single_File_H3C.html
          grep -q 'window.THREE = THREE;' /tmp/KAYAS_3D_Model_v5_Single_File_H3C.html
          wc -c /tmp/KAYAS_3D_Model_v5_Single_File_H3C.html

      - name: Extract offline Three.js global runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/KAYAS_3D_Model_v5_Single_File_H3C.html').read_text(encoding='utf-8')
          start_marker = '/* KAYAS OSB 3D Walkthrough file-safe bundle. */'
          end_marker = 'window.THREE = THREE;'
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          runtime = source[start:end] + '\n})();\n'
          target = Path('kayas/walkthrough/vendor/three.global.r166.js')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(runtime, encoding='utf-8')
          if target.stat().st_size < 1_000_000:
              raise SystemExit('Extracted Three.js runtime is unexpectedly small')
          print(f'OFFLINE_THREE_BYTES={target.stat().st_size}')
          PY
          node --check kayas/walkthrough/vendor/three.global.r166.js
          sha256sum kayas/walkthrough/vendor/three.global.r166.js
          printf '%s\n' \
            'Three.js r166 extracted from KAYAS_3D_Model_v5_Single_File_H3C.html.' \
            'Original source is a public, verified, self-contained offline KAYAS model.' \
            'Three.js is licensed under MIT.' \
            > kayas/walkthrough/vendor/README.txt

      - name: Commit offline runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kayas/walkthrough/vendor/three.global.r166.js kayas/walkthrough/vendor/README.txt
          if git diff --cached --quiet; then
            echo 'Offline Three.js runtime is already current.'
            exit 0
          fi
          git commit -m 'Vendor offline Three.js runtime for KAYAS walkthrough [skip ci]'
          git push origin HEAD:main
