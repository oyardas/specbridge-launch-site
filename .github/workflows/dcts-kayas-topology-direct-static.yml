name: DCTS KAYAS topology direct static

on:
  workflow_dispatch:
  push:
    paths:
      - 'kayas/topology/direct-static.trigger'

permissions:
  contents: write

jobs:
  build-direct-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v0.11.9 from controlled payloads
        shell: bash
        run: |
          set -euo pipefail
          cd kayas/topology
          cat payload-01.txt payload-02.txt payload-03.txt payload-04.txt payload-05.txt \
              payload-06.txt payload-07.txt payload-08.txt payload-09.txt payload-10.txt \
            | tr -d '\r\n ' | base64 --decode | gzip -dc > /tmp/kayas-viewer.html
          test -s /tmp/kayas-viewer.html
          grep -q 'v0.11.9' /tmp/kayas-viewer.html
          grep -qi '<!doctype html' /tmp/kayas-viewer.html

      - name: Harden direct production document
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/kayas-viewer.html')
          s=p.read_text(encoding='utf-8-sig')
          s=s.replace('<title>DCTS · KAYAS Architecture Story Canvas v0.11.0</title>', '<title>KAYAS Interactive Architecture · DCTS v0.11.9</title>')
          needle='<meta name="viewport" content="width=device-width,initial-scale=1">'
          guard='''\n<meta name="robots" content="noindex,nofollow,noarchive">\n<meta name="author" content="Önder Yardaş">\n<script>\n(function(){\n  const AUTH_KEY='kayas_walkthrough_auth_until';\n  let ok=false;\n  try{ok=Number(localStorage.getItem(AUTH_KEY)||0)>Date.now()}catch(_){}\n  if(!ok){location.replace('/kayas/');}\n})();\n</script>'''
          if 'kayas_walkthrough_auth_until' not in s:
              if needle not in s: raise SystemExit('viewport anchor missing')
              s=s.replace(needle,needle+guard,1)
          s=s.replace('v0.11.9 · Executive 5/5 Visual Pass + T00 Drill-Down Hardening', 'v0.11.9 · Executive 5/5 Visual Pass + T00 Drill-Down Hardening · Direct Static Delivery',1)
          if 'DCTS_DEPLOYMENT=SPECBridge_KAYAS_DIRECT_STATIC_v0119' not in s:
              s=s.replace('</head>','<!-- DCTS_DEPLOYMENT=SPECBridge_KAYAS_DIRECT_STATIC_v0119 -->\n</head>',1)
          Path('kayas/topology/index.html').write_text(s,encoding='utf-8')
          PY
          grep -q 'DCTS_DEPLOYMENT=SPECBridge_KAYAS_DIRECT_STATIC_v0119' kayas/topology/index.html
          grep -q 'kayas_walkthrough_auth_until' kayas/topology/index.html
          test $(wc -c < kayas/topology/index.html) -gt 200000

      - name: Commit direct static viewer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OnderYardas'
          git config user.email '92328486+oyardas@users.noreply.github.com'
          git add kayas/topology/index.html
          if git diff --cached --quiet; then
            echo 'No direct-static change required.'
            exit 0
          fi
          git commit -m 'Deploy KAYAS topology as direct static v0.11.9'
          git push origin HEAD:main
