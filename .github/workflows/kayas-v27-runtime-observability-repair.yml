name: Validate and Activate KAYAS V27 Runtime Observability Repair

on:
  push:
    branches: [main]
    paths:
      - kayas/walkthrough/v27-live-dashboards.js
      - .github/workflows/kayas-v27-runtime-observability-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-v27-runtime-observability-repair
  cancel-in-progress: true

jobs:
  validate-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate repaired runtime
        run: |
          set -euo pipefail
          node --check kayas/walkthrough/v27-live-dashboards.js
          grep -q "20260804-v27-live-dashboards-r1" kayas/walkthrough/v27-live-dashboards.js
          grep -q "state.frames%30===0" kayas/walkthrough/v27-live-dashboards.js
          grep -q "DASHBOARD_2D_CONTEXT_UNAVAILABLE" kayas/walkthrough/v27-live-dashboards.js
          grep -q "20 pods · 200 cabinets" kayas/walkthrough/v27-live-dashboards.js

      - name: Activate repaired cache identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('kayas/walkthrough/index.html')
          text=path.read_text(encoding='utf-8')
          text,n=re.subn(r'v27-live-dashboards\.js\?v=[^"\s]+','v27-live-dashboards.js?v=20260804-v27-live-dashboards-r1',text)
          if n != 1:
              raise SystemExit(f'V27 reference replacement count={n}')
          if text.count('v27-live-dashboards.js?v=20260804-v27-live-dashboards-r1') != 1:
              raise SystemExit('Repaired V27 reference is not unique')
          path.write_text(text,encoding='utf-8')
          PY

      - name: Record exact static acceptance
        run: |
          set -euo pipefail
          SHA=$(sha256sum kayas/walkthrough/v27-live-dashboards.js | awk '{print $1}')
          SIZE=$(wc -c < kayas/walkthrough/v27-live-dashboards.js | tr -d ' ')
          node - <<'JS' "$SHA" "$SIZE"
          const fs=require('fs');
          const [sha,size]=process.argv.slice(2);
          const result={
            version:'20260804-v27-live-dashboards-r1',
            pass:true,
            validation:'STATIC_NODE_CHECK_AND_CONTRACT_PASS',
            browserAcceptance:'NOT_EXECUTED_IN_THIS_BOUNDED_GATE',
            sha256:sha,
            sizeBytes:Number(size),
            assertions:{syntax:true,liveStatusPublication:true,mobileThrottle:true,visibilityPause:true,metricContract:true,uniqueIndexReference:true},
            layoutMutation:false,
            timestamp:new Date().toISOString()
          };
          fs.writeFileSync('kayas/walkthrough/smoke-status-v27-observability.json',JSON.stringify(result,null,2)+'\n');
          JS

      - name: Commit activation and evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/index.html kayas/walkthrough/smoke-status-v27-observability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate repaired KAYAS V27 runtime observability [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
