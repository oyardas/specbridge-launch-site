name: KAYAS Rev16.5.2 Architecture-Locked Review

on:
  push:
    branches: [main]
    paths:
      - 'kayas/rev16-5-2/**'
      - '.github/workflows/kayas-rev1652-architecture-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-rev1652-architecture-lock
  cancel-in-progress: false

jobs:
  validate-and-vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble review application
        shell: bash
        run: |
          set -euo pipefail
          cat kayas/rev16-5-2/build/app.part-* > kayas/rev16-5-2/app.js

      - name: Apply runtime performance guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          p=Path('kayas/rev16-5-2/app.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "renderer.setPixelRatio(Math.min(1.5,devicePixelRatio||1));":"renderer.setPixelRatio(Math.min(1.0,devicePixelRatio||1));",
            "renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;":"renderer.shadowMap.enabled=false;",
            "sun.position.set(24,34,94);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);":"sun.position.set(24,34,94);sun.castShadow=false;sun.shadow.mapSize.set(1024,1024);",
            "function drawMini(){const c=document.getElementById('mini'),x=c.getContext('2d'),W=c.width=c.clientWidth*devicePixelRatio,H=c.height=c.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);":"function drawMini(){const c=document.getElementById('mini');if(!c||!c.parentElement||getComputedStyle(c.parentElement).display==='none')return;const x=c.getContext('2d'),dpr=Math.min(1,devicePixelRatio||1),tw=Math.max(1,Math.floor(c.clientWidth*dpr)),th=Math.max(1,Math.floor(c.clientHeight*dpr));if(c.width!==tw)c.width=tw;if(c.height!==th)c.height=th;const W=c.width,H=c.height;x.setTransform(dpr,0,0,dpr,0,0);",
            "document.getElementById('homeBtn').onclick=openLanding;":"let kayasAssetsPromise=null;window.ensureKAYASAssets=()=>{if(!kayasAssetsPromise){document.getElementById('status').textContent='LOADING DATA HALL EQUIPMENT';kayasAssetsPromise=installAssets().then(()=>{document.getElementById('status').textContent='206 IT CABINETS · 1,972 kW';return true}).catch(e=>{console.error(e);kayasAssetsPromise=null;document.getElementById('status').textContent='3D SHELL READY';return false})}return kayasAssetsPromise};document.getElementById('homeBtn').onclick=openLanding;",
            "document.getElementById('dataBtn').onclick=()=>{document.getElementById('landing').classList.add('hidden');setWalkPose(27.5,68.2,27.5,56.0,":"document.getElementById('dataBtn').onclick=()=>{window.ensureKAYASAssets();document.getElementById('landing').classList.add('hidden');setWalkPose(27.5,68.2,27.5,56.0,",
            "(async()=>{try{overview();requestAnimationFrame(frame);await new Promise(r=>setTimeout(r,250));document.getElementById('loading').classList.add('hidden');document.getElementById('landing').classList.remove('hidden');document.getElementById('status').textContent='SHELL READY · BUILDING ARCH-LOCKED ASSETS';installAssets().then(()=>{document.getElementById('status').textContent='READY · REV16.5.2 ARCHITECTURE LOCKED';}).catch(e=>{console.error(e);document.getElementById('status').textContent='SHELL READY · ASSET FALLBACK MODE';});}catch(e){console.error(e);document.querySelector('#loading .loadbox b').textContent='Rev16.5.2 shell could not initialize';document.querySelector('#loading .loadbox span').textContent=e.message||String(e)}})();":"(async()=>{try{overview();requestAnimationFrame(frame);await new Promise(r=>setTimeout(r,120));document.getElementById('loading').classList.add('hidden');document.getElementById('landing').classList.remove('hidden');document.getElementById('status').textContent='206 IT CABINETS · 1,972 kW';}catch(e){console.error(e);document.querySelector('#loading .loadbox b').textContent='KAYAS 3D could not initialize';document.querySelector('#loading .loadbox span').textContent=e.message||String(e)}})();"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected runtime pattern missing: '+old[:120])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY2

      - name: Validate review application
        shell: bash
        run: |
          set -euo pipefail
          node --check kayas/rev16-5-2/app.js
          grep -q 'Rev16.5.2' kayas/rev16-5-2/index.html
          grep -q 'MİMARİ SINIR / ARCHITECTURAL LOCK' kayas/rev16-5-2/index.html
          grep -q 'const ZONE_VISUALS={};' kayas/rev16-5-2/app.js
          grep -q 'Bina köşe zonudur' kayas/rev16-5-2/app.js
          grep -q 'window.ensureKAYASAssets' kayas/rev16-5-2/app.js
          grep -q 'renderer.shadowMap.enabled=false' kayas/rev16-5-2/app.js

      - name: Vendor offline Three.js r166 when missing
        shell: bash
        run: |
          set -euo pipefail
          target='kayas/walkthrough/vendor/three.global.r166.js'
          if [ -s "$target" ]; then
            echo 'Offline Three.js runtime already present.'
            exit 0
          fi
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1Y_P2iS8zqqKVtrXHY2ZteyBxSPGMjHCz' \
            -o /tmp/KAYAS_3D_Model_v5_Single_File_H3C.html
          python - <<'PY2'
          from pathlib import Path
          source=Path('/tmp/KAYAS_3D_Model_v5_Single_File_H3C.html').read_text(encoding='utf-8')
          start=source.index('/* KAYAS OSB 3D Walkthrough file-safe bundle. */')
          marker='window.THREE = THREE;'
          end=source.index(marker,start)+len(marker)
          runtime=source[start:end]+'\n})();\n'
          target=Path('kayas/walkthrough/vendor/three.global.r166.js')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(runtime,encoding='utf-8')
          if target.stat().st_size < 1_000_000:
              raise SystemExit('Three.js runtime unexpectedly small')
          PY2
          node --check "$target"
          printf '%s\n' 'Three.js r166 offline runtime for KAYAS walkthrough.' 'Extracted from the verified single-file KAYAS source; Three.js is MIT licensed.' > kayas/walkthrough/vendor/README.txt

      - name: Commit assembled runtime if changed
        shell: bash
        run: |
          set -euo pipefail
          git add kayas/rev16-5-2/app.js kayas/walkthrough/vendor/three.global.r166.js kayas/walkthrough/vendor/README.txt || true
          if git diff --cached --quiet; then
            echo 'No runtime commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble optimized KAYAS 3D runtime [skip ci]'
          git push origin HEAD:main
