name: Data Center Knowledge Wave 1 Audio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/datacenter-knowledge-wave1-audio.yml
      - datacenter/knowledge/narration/WAVE1_MASTER_NARRATION_TR.md
      - datacenter/knowledge/narration/generate_wave1_audio.py
      - datacenter/narration/PRODUCTION_VOICE_TR_V1.json

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade openai mutagen num2words

      - name: Generate and validate Wave 1 Turkish knowledge audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python datacenter/knowledge/narration/generate_wave1_audio.py

      - name: Upload Wave 1 knowledge audio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datacenter-knowledge-wave1-audio-tr-v1
          path: datacenter/knowledge/audio/production/tr/
          if-no-files-found: error
          retention-days: 30
