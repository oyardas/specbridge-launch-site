name: Activate and Validate KAYAS V30 Report Asset Guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-v30-report-asset-guard.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-v30-report-asset-guard
  cancel-in-progress: true

jobs:
  activate-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Activate bounded report guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('kayas/walkthrough/index.html')
          text=path.read_text(encoding='utf-8')
          text=re.sub(r'\s*<script[^>]+src="v30-report-asset-guard\.js\?v=[^"]+"[^>]*></script>','',text)
          anchor=re.search(r'\s*<script defer src="app-shell\.js\?v=[^"]+"></script>',text)
          if not anchor:
              raise SystemExit('app-shell anchor missing')
          script='  <script defer src="v30-report-asset-guard.js?v=20260804-v30-report-asset-guard"></script>\n'
          text=text[:anchor.start()]+'\n'+script+text[anchor.start():]
          if text.count('v30-report-asset-guard.js?v=20260804-v30-report-asset-guard') != 1:
              raise SystemExit('report guard reference count is not one')
          path.write_text(text,encoding='utf-8')
          PY
          node --check kayas/walkthrough/v30-report-asset-guard.js
          find kayas/walkthrough -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kayas-v30-report
          cd /tmp/kayas-v30-report
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run Chromium WebGL acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/kayas-v30-report-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/kayas-v30-report/test.js <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const missing='KAYAS_OSB_Yerinde_Fizibilite_Saha_Raporu.pdf';
            const result={version:'20260804-v30-report-asset-guard',pass:false,timestamp:new Date().toISOString(),pageErrors:[],consoleErrors:[],failedRequests:[],missingReportRequests:[]};
            let browser;
            try{
              browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
              const page=await browser.newPage({viewport:{width:1536,height:960}});
              page.on('pageerror',e=>result.pageErrors.push({message:e.message,stack:e.stack||''}));
              page.on('console',m=>{if(m.type()==='error')result.consoleErrors.push({text:m.text(),location:m.location()})});
              page.on('request',r=>{if(r.url().includes(missing))result.missingReportRequests.push(r.url())});
              page.on('requestfailed',r=>result.failedRequests.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));
              await page.goto('http://127.0.0.1:8000/kayas/walkthrough/?build=20260804-v30-report-asset-guard',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>window.__KAYAS_V30_REPORT_GUARD_STATUS?.ready===true,null,{timeout:30000});
              await page.waitForTimeout(1500);
              Object.assign(result,await page.evaluate(()=>{
                const guard=window.__KAYAS_V30_REPORT_GUARD_STATUS;
                const frame=document.getElementById('reportFrame');
                const disabled=[...document.querySelectorAll('.report-item[data-kayas-v30-report-guard="1"]')];
                const canvas=document.getElementById('scene');
                return {
                  guard,
                  disabledItems:disabled.length,
                  disabledState:disabled.every(i=>i.disabled&&i.getAttribute('aria-disabled')==='true'&&!i.dataset.reportSrc&&!i.dataset.reportDownload),
                  frameState:frame?.dataset.assetState||'',
                  frameHasSrcdoc:!!frame?.srcdoc,
                  frameSrcAttribute:frame?.getAttribute('src')||'',
                  webgl:!!(canvas&&(canvas.getContext('webgl2')||canvas.getContext('webgl'))),
                  canvas:{width:canvas?.width||0,height:canvas?.height||0},
                  layoutMetric:document.body.textContent.includes('110 m')&&document.body.textContent.includes('46 m')&&document.body.textContent.includes('200')
                };
              }));
              const fatal=result.pageErrors.filter(e=>/SyntaxError|ReferenceError|TypeError|Invalid or unexpected token/i.test(e.message));
              result.fatalErrors=fatal;
              result.pass=result.guard?.ready===true&&result.guard.errors?.length===0&&result.disabledItems===1&&result.disabledState===true&&result.frameState==='unavailable'&&result.frameHasSrcdoc===true&&result.frameSrcAttribute===''&&result.missingReportRequests.length===0&&result.webgl===true&&result.canvas.width>500&&result.canvas.height>300&&result.layoutMetric===true&&fatal.length===0;
              await page.screenshot({path:'/tmp/kayas-v30-report/acceptance.png',fullPage:true});
            }catch(error){result.pageErrors.push({message:error.message||String(error),stack:error.stack||''});}
            finally{
              if(browser)await browser.close();
              fs.writeFileSync('/tmp/kayas-v30-report/status.json',JSON.stringify(result,null,2));
              console.log(JSON.stringify(result,null,2));
            }
          })();
          JS
          cd /tmp/kayas-v30-report
          node test.js

      - name: Record exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/kayas-v30-report/status.json; then
            cp /tmp/kayas-v30-report/status.json kayas/walkthrough/smoke-status-v30-report-asset-guard.json
          else
            printf '%s\n' '{"version":"20260804-v30-report-asset-guard","pass":false,"error":"status missing"}' > kayas/walkthrough/smoke-status-v30-report-asset-guard.json
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/index.html kayas/walkthrough/smoke-status-v30-report-asset-guard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Guard missing KAYAS field report asset and record acceptance [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce acceptance
        shell: bash
        run: |
          node -e "const r=require('/tmp/kayas-v30-report/status.json');if(!r.pass){console.error(r);process.exit(1)}console.log('KAYAS_V30_REPORT_ASSET_GUARD=PASS')"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kayas-v30-report-asset-guard
          path: |
            /tmp/kayas-v30-report/status.json
            /tmp/kayas-v30-report/acceptance.png
          if-no-files-found: warn
