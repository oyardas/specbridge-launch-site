name: Activate KAYAS V26 Investor Polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-v26-investor-polish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-v26-investor-polish
  cancel-in-progress: true

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate V26 assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('kayas/walkthrough/index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'\s*<link[^>]+href="v26-investor-polish\.css\?v=[^"]+"[^>]*>','',text)
          text=re.sub(r'\s*<script[^>]+src="v26-investor-polish\.js\?v=[^"]+"[^>]*></script>','',text)
          css='  <link id="kayas-v26-css" rel="stylesheet" href="v26-investor-polish.css?v=20260803-v26-investor-polish" />\n'
          js='  <script defer src="v26-investor-polish.js?v=20260803-v26-investor-polish"></script>\n'
          head='</head>'
          if head not in text: raise SystemExit('head anchor missing')
          text=text.replace(head,css+head,1)
          anchor=re.search(r'\s*<script defer src="app-shell\.js\?v=[^"]+"></script>',text)
          if not anchor: raise SystemExit('app-shell anchor missing')
          text=text[:anchor.start()]+'\n'+js+text[anchor.start():]
          if text.count('v26-investor-polish.css?v=20260803-v26-investor-polish')!=1: raise SystemExit('CSS ref not singular')
          if text.count('v26-investor-polish.js?v=20260803-v26-investor-polish')!=1: raise SystemExit('JS ref not singular')
          p.write_text(text,encoding='utf-8')
          PY
          node --check kayas/walkthrough/v26-investor-polish.js
          test -s kayas/walkthrough/v26-investor-polish.css
          grep -q 'v25-rack-detail.js?v=20260803-v25-rack-detail' kayas/walkthrough/index.html
          grep -q 'v26-investor-polish.js?v=20260803-v26-investor-polish' kayas/walkthrough/index.html
          grep -q 'v26-investor-polish.css?v=20260803-v26-investor-polish' kayas/walkthrough/index.html
          printf '%s\n' '{"version":"20260803-v26-investor-polish","static_pass":true,"layout_geometry_changed":false,"checks":["javascript_syntax","css_present","v25_preserved","v26_single_reference"]}' > kayas/walkthrough/smoke-status-v26.json

      - name: Commit activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/index.html kayas/walkthrough/smoke-status-v26.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate KAYAS V26 investor polish [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
