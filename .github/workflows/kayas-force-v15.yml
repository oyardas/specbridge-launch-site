name: Force KAYAS Offline Loader v15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-force-v15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update published cache keys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('kayas/walkthrough/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('model-loader.js?v=20260803-11', 'model-loader.js?v=20260803-v15')
          text = text.replace('model-loader.js?v=20260803-13', 'model-loader.js?v=20260803-v15')
          text = text.replace('model-loader.js?v=20260803-v14', 'model-loader.js?v=20260803-v15')
          p.write_text(text, encoding='utf-8')
          if 'model-loader.js?v=20260803-v15' not in text:
              raise SystemExit('v15 loader reference was not installed')
          PY
      - name: Commit cache-key update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kayas/walkthrough/index.html
          if git diff --cached --quiet; then
            echo 'Published HTML already references v15.'
            exit 0
          fi
          git commit -m 'Force KAYAS offline loader v15 [skip ci]'
          git push origin HEAD:main
