name: Deploy KAYAS Investment Guide

on:
  pull_request:
    paths:
      - .github/workflows/kayas-investment-guide.yml
      - kayas/.guide-deploy-trigger
      - kayas/guide-enhancements/**
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-investment-guide.yml
      - kayas/.guide-deploy-trigger
      - kayas/guide-enhancements/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check gdown python-docx

      - name: Download controlled web sources and guide documents
        run: |
          set -euo pipefail
          mkdir -p /tmp/kayas-guide-src /tmp/kayas-guide-docs
          gdown "https://drive.google.com/uc?id=1c90dN4ZUN8Oit_UyXInLu5f5sPezflWi" -O /tmp/kayas-guide-src/index.html
          gdown "https://drive.google.com/uc?id=1Ev7dYJ5uJA2kkA3OCNiLIAoNY9lDad3A" -O /tmp/kayas-guide-src/styles.css
          gdown "https://drive.google.com/uc?id=1hRNRiK_pXvUtglOHSztIQU3MlB4-E7K2" -O /tmp/kayas-guide-src/app.js
          gdown "https://drive.google.com/uc?id=1JVjd74orxNA5IHybGP0fBUfCi1Gmgp7d" -O /tmp/kayas-guide-src/build_guide_data.py
          gdown "https://drive.google.com/uc?id=1BsX_X41lAx3ODDVPARMuacspEFsszlc7" -O /tmp/kayas-guide-src/guide-data.js
          gdown "https://drive.google.com/uc?id=1RWd9vkHCFOxqwmuA-OWe4FI5ZVsqv_tB" -O /tmp/kayas-guide-src/model-loader.js
          gdown "https://drive.google.com/uc?id=1iTc_iO62bCwNXZ3jv0DzR2fE5Kvtguv5" -O /tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.pdf
          gdown "https://drive.google.com/uc?id=132jLoD0huj3iXtAI7uhgATLYV-Fqox-g" -O /tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.docx
          test "$(stat -c%s /tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.pdf)" -gt 1000000
          test "$(stat -c%s /tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.docx)" -gt 1000000

      - name: Verify pinned source integrity
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'f3a63481252b077fc02c015c105f5fc4ebddbb93cb0fe5b75caa45f841596c1a' '/tmp/kayas-guide-src/index.html' \
            'e933c6be030c51ee9e300f640be369f93c4404c794cfdd829c0dfa29ae3087b7' '/tmp/kayas-guide-src/styles.css' \
            '56287b55fddab2b82a8098a1c1cc53539de44f0a4bc4d65c11e10dab2136c22e' '/tmp/kayas-guide-src/app.js' \
            '629a84118d08cd4dd33a20cde904c8ce2c41aaf141e45afe2293bea2ef3791d9' '/tmp/kayas-guide-src/build_guide_data.py' \
            '7353cd7418e01c33d0804170720d98e3522fcdbdab4c565b7070424605f9700b' '/tmp/kayas-guide-src/guide-data.js' \
            '5f2e86b0b3a9e9e695f9e3d95e197368a5ccb579de2ea99889158964b77a0b85' '/tmp/kayas-guide-src/model-loader.js' \
            '42c61892d5c9ba80f829db74d03195aa39f4a3b84835dddaa1ba343595a8f595' '/tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.pdf' \
            '45c52ac80c899fc12b69c9ba090d55055f11bbcbbf54732e6eff6e852d41c6cf' '/tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.docx' | sha256sum -c -

      - name: Materialize dynamic guide
        run: |
          set -euo pipefail
          DEST=kayas/yatirim_ve_teknoloji_rehberi
          mkdir -p "$DEST/assets" "$DEST/tools"
          cp /tmp/kayas-guide-src/index.html "$DEST/index.html"
          cp /tmp/kayas-guide-src/styles.css "$DEST/styles.css"
          cp /tmp/kayas-guide-src/app.js "$DEST/app.js"
          cp /tmp/kayas-guide-src/build_guide_data.py "$DEST/tools/build_guide_data.py"
          cp /tmp/kayas-guide-src/guide-data.js "$DEST/guide-data.js"
          cp /tmp/kayas-guide-src/model-loader.js kayas/model-loader.js
          cp /tmp/kayas-guide-docs/* "$DEST/assets/"
          cp kayas/guide-enhancements/executive-visuals.css "$DEST/executive-visuals.css"
          cp kayas/guide-enhancements/executive-visuals.js "$DEST/executive-visuals.js"
          cp kayas/guide-enhancements/v44-enhancements.css "$DEST/v44-enhancements.css"
          cp kayas/guide-enhancements/v44-enhancements.js "$DEST/v44-enhancements.js"
          python "$DEST/tools/build_guide_data.py" "$DEST/assets/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.docx" "$DEST/guide-data.js"
          python - <<'PY'
          from pathlib import Path
          p=Path('kayas/yatirim_ve_teknoloji_rehberi/index.html')
          s=p.read_text(encoding='utf-8')
          css='  <link rel="stylesheet" href="executive-visuals.css?v=20260808-exec1" />\n'
          js='  <script src="executive-visuals.js?v=20260808-exec1"></script>\n'
          css44='  <link rel="stylesheet" href="v44-enhancements.css?v=20260808-v44" />\n'
          js44='  <script src="v44-enhancements.js?v=20260808-v44"></script>\n'
          if 'executive-visuals.css' not in s:
              s=s.replace('</head>',css+'</head>')
          if 'v44-enhancements.css' not in s:
              s=s.replace('</head>',css44+'</head>')
          if 'executive-visuals.js' not in s:
              s=s.replace('</body>',js+'</body>')
          if 'v44-enhancements.js' not in s:
              s=s.replace('</body>',js44+'</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate publication contract
        run: |
          set -euo pipefail
          DEST=kayas/yatirim_ve_teknoloji_rehberi
          node --check "$DEST/app.js"
          node --check "$DEST/guide-data.js"
          node --check "$DEST/executive-visuals.js"
          node --check "$DEST/v44-enhancements.js"
          node --check kayas/model-loader.js
          grep -q "Yatırım ve Teknoloji Rehberi" "$DEST/index.html"
          grep -q '"itCabinetsTotal":206' "$DEST/guide-data.js"
          grep -q '"itLoadKw":1972' "$DEST/guide-data.js"
          grep -q "196 hava" "$DEST/index.html"
          grep -q "1.972 MW" "$DEST/index.html"
          grep -q "yatirim_ve_teknoloji_rehberi/" kayas/model-loader.js
          grep -q "executive-visuals.css" "$DEST/index.html"
          grep -q "executive-visuals.js" "$DEST/index.html"
          grep -q "v44-enhancements.css" "$DEST/index.html"
          grep -q "v44-enhancements.js" "$DEST/index.html"
          grep -q "Konuya hızlı giriş" "$DEST/v44-enhancements.js"
          grep -q "v44-dashboard" "$DEST/v44-enhancements.js"
          grep -q "chapter-carousel" "$DEST/executive-visuals.js"
          count=$(grep -o '"id":"' "$DEST/guide-data.js" | wc -l)
          test "$count" -ge 29

      - name: Commit publication to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kayas/model-loader.js kayas/yatirim_ve_teknoloji_rehberi
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git commit -m "Publish KAYAS v4.4 web enhancements [skip ci]"
          git push origin HEAD:main
