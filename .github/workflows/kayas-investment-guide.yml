name: Deploy KAYAS Investment Guide

on:
  pull_request:
    paths:
      - .github/workflows/kayas-investment-guide.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-investment-guide.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check gdown python-docx

      - name: Download controlled web sources and guide documents
        run: |
          set -euo pipefail
          mkdir -p /tmp/kayas-guide-src /tmp/kayas-guide-docs
          gdown "https://drive.google.com/uc?id=1c90dN4ZUN8Oit_UyXInLu5f5sPezflWi" -O /tmp/kayas-guide-src/index.html
          gdown "https://drive.google.com/uc?id=1Ev7dYJ5uJA2kkA3OCNiLIAoNY9lDad3A" -O /tmp/kayas-guide-src/styles.css
          gdown "https://drive.google.com/uc?id=1hRNRiK_pXvUtglOHSztIQU3MlB4-E7K2" -O /tmp/kayas-guide-src/app.js
          gdown "https://drive.google.com/uc?id=1JVjd74orxNA5IHybGP0fBUfCi1Gmgp7d" -O /tmp/kayas-guide-src/build_guide_data.py
          gdown "https://drive.google.com/uc?id=1BsX_X41lAx3ODDVPARMuacspEFsszlc7" -O /tmp/kayas-guide-src/guide-data.js
          gdown "https://drive.google.com/uc?id=1RWd9vkHCFOxqwmuA-OWe4FI5ZVsqv_tB" -O /tmp/kayas-guide-src/model-loader.js
          gdown "https://drive.google.com/uc?id=1iTc_iO62bCwNXZ3jv0DzR2fE5Kvtguv5" -O /tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.pdf
          gdown "https://drive.google.com/uc?id=132jLoD0huj3iXtAI7uhgATLYV-Fqox-g" -O /tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.docx
          test "$(stat -c%s /tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.pdf)" -gt 1000000
          test "$(stat -c%s /tmp/kayas-guide-docs/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.docx)" -gt 1000000

      - name: Materialize dynamic guide
        run: |
          set -euo pipefail
          DEST=kayas/yatirim_ve_teknoloji_rehberi
          mkdir -p "$DEST/assets" "$DEST/tools"
          cp /tmp/kayas-guide-src/index.html "$DEST/index.html"
          cp /tmp/kayas-guide-src/styles.css "$DEST/styles.css"
          cp /tmp/kayas-guide-src/app.js "$DEST/app.js"
          cp /tmp/kayas-guide-src/build_guide_data.py "$DEST/tools/build_guide_data.py"
          cp /tmp/kayas-guide-src/guide-data.js "$DEST/guide-data.js"
          cp /tmp/kayas-guide-src/model-loader.js kayas/model-loader.js
          cp /tmp/kayas-guide-docs/* "$DEST/assets/"
          python "$DEST/tools/build_guide_data.py" "$DEST/assets/KAYAS_DC_Yatirim_ve_Teknoloji_Rehberi_v3.2_Editorial_Editable_Final.docx" "$DEST/guide-data.js"

      - name: Validate publication contract
        run: |
          set -euo pipefail
          DEST=kayas/yatirim_ve_teknoloji_rehberi
          node --check "$DEST/app.js"
          node --check "$DEST/guide-data.js"
          node --check kayas/model-loader.js
          grep -q "Yatırım ve Teknoloji Rehberi" "$DEST/index.html"
          grep -q '"itCabinetsTotal":206' "$DEST/guide-data.js"
          grep -q '"itLoadKw":1972' "$DEST/guide-data.js"
          grep -q "196 hava" "$DEST/index.html"
          grep -q "1.972 MW" "$DEST/index.html"
          grep -q "yatirim_ve_teknoloji_rehberi/" kayas/model-loader.js
          test "$(grep -o '"'"'"id":"'"'"' "$DEST/guide-data.js" | wc -l)" -ge 29

      - name: Commit publication to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kayas/model-loader.js kayas/yatirim_ve_teknoloji_rehberi
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git commit -m "Publish KAYAS investment and technology guide [skip ci]"
          git push origin HEAD:main
