name: Deploy KAYAS Walkthrough Assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-walkthrough-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Google Drive downloader
        run: python -m pip install --disable-pip-version-check gdown

      - name: Download KAYAS v8 source package
        run: |
          set -euo pipefail
          rm -rf /tmp/kayas-v8
          mkdir -p /tmp/kayas-v8
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1V0LLZOKwf2dFJO3rKdRGuLTvC8H0eckJ" -O /tmp/kayas-v8
          find /tmp/kayas-v8 -maxdepth 5 -type f | sort

      - name: Locate and install model and media assets
        run: |
          set -euo pipefail
          BUNDLE="$(find /tmp/kayas-v8 -type f -name 'kayas-3d.bundle.js' | head -n 1)"
          test -n "$BUNDLE"
          ROOT="$(dirname "$(dirname "$BUNDLE")")"
          test -f "$ROOT/assets/gallery/gallery_manifest.js"
          test -f "$ROOT/assets/reference/ic8000_cold_aisle_left_view.png"

          mkdir -p kayas/walkthrough/src
          mkdir -p kayas/walkthrough/assets/gallery
          mkdir -p kayas/walkthrough/assets/reference
          mkdir -p kayas/walkthrough/assets/logos
          mkdir -p kayas/walkthrough/assets/report

          cp "$BUNDLE" kayas/walkthrough/src/kayas-3d.bundle.js
          cp "$ROOT/assets/gallery/gallery_manifest.js" kayas/walkthrough/assets/gallery/gallery_manifest.js
          cp "$ROOT/assets/gallery/gallery_manifest.json" kayas/walkthrough/assets/gallery/gallery_manifest.json
          cp "$ROOT"/assets/gallery/*.webp kayas/walkthrough/assets/gallery/
          cp "$ROOT"/assets/reference/* kayas/walkthrough/assets/reference/
          cp "$ROOT"/assets/logos/* kayas/walkthrough/assets/logos/
          cp "$ROOT"/assets/report/*.pdf kayas/walkthrough/assets/report/

          python - <<'PY'
          from pathlib import Path
          p=Path('kayas/walkthrough/src/kayas-3d.bundle.js')
          text=p.read_text(encoding='utf-8')
          # Keep all relative asset references local to /kayas/walkthrough/.
          text=text.replace('window.KAYAS_GALLERY_DATA||{items:[]}', 'window.KAYAS_GALLERY_DATA||{items:[]}')
          p.write_text(text,encoding='utf-8')
          PY

      - name: Commit generated walkthrough assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kayas/walkthrough/src/kayas-3d.bundle.js \
                  kayas/walkthrough/assets/gallery \
                  kayas/walkthrough/assets/reference \
                  kayas/walkthrough/assets/logos \
                  kayas/walkthrough/assets/report
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "Deploy KAYAS v8 walkthrough model and media [skip ci]"
          git push origin HEAD:main
