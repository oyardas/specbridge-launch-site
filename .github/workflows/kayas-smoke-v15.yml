name: Validate KAYAS Direct Authoritative Loader v17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-smoke-v15.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-smoke-direct-v17
  cancel-in-progress: false

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify direct loader configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s kayas/walkthrough/model-loader.js
          grep -q 'model-loader.js?v=20260803-direct-v17' kayas/walkthrough/index.html
          grep -q '19zW6DgqhSjWrRFnxDjs58NhTa5aykdGc' kayas/walkthrough/model-loader.js
          node --check kayas/walkthrough/model-loader.js

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kayas-smoke-v17
          cd /tmp/kayas-smoke-v17
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/kayas-http-v17.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/kayas-smoke-v17/smoke.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const result = { pass: false, version: 'direct-v17', timestamp: new Date().toISOString(), errors: [], consoleErrors: [], failedRequests: [] };
            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--disable-dev-shm-usage']
              });
              const page = await browser.newPage({ viewport: { width: 1536, height: 960 } });
              page.on('console', msg => { if (msg.type() === 'error') result.consoleErrors.push(msg.text()); });
              page.on('pageerror', error => result.errors.push(error.message));
              page.on('requestfailed', request => result.failedRequests.push({ url: request.url(), error: request.failure()?.errorText || 'unknown' }));
              await page.goto('http://127.0.0.1:8000/kayas/walkthrough/?smoke=direct-v17', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForFunction(() => window.__KAYAS_MODEL_READY === true || !!window.__KAYAS_LOADER_ERROR, null, { timeout: 120000 });
              Object.assign(result, await page.evaluate(() => ({
                ready: window.__KAYAS_MODEL_READY === true,
                mode: window.__KAYAS_MODEL_MODE || null,
                source: window.__KAYAS_MODEL_SOURCE || null,
                loaderError: window.__KAYAS_LOADER_ERROR || null,
                canvas: (() => { const c = document.getElementById('scene'); return c ? { width: c.width, height: c.height } : null; })(),
                status: (() => { const s = document.getElementById('loadStatus'); return s ? { hidden: s.hidden, title: s.querySelector('strong')?.textContent, message: s.querySelector('span')?.textContent } : null; })()
              })));
              result.pass = result.ready === true && result.canvas && result.canvas.width > 300 && result.canvas.height > 150;
              await page.screenshot({ path: '/tmp/kayas-smoke-v17/screenshot.png', fullPage: true });
            } catch (error) {
              result.errors.push(error.stack || error.message || String(error));
            } finally {
              if (browser) await browser.close();
              fs.writeFileSync('/tmp/kayas-smoke-v17/status.json', JSON.stringify(result, null, 2));
              console.log(JSON.stringify(result, null, 2));
            }
          })();
          JS
          cd /tmp/kayas-smoke-v17
          node smoke.js

      - name: Commit smoke result
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kayas-smoke-v17/status.json kayas/walkthrough/smoke-status-v17.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kayas/walkthrough/smoke-status-v17.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record KAYAS direct-v17 browser smoke result [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: kayas-direct-v17-smoke
          path: |
            /tmp/kayas-smoke-v17/status.json
            /tmp/kayas-smoke-v17/screenshot.png

      - name: Enforce result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/kayas-smoke-v17/status.json').read_text())
          if not result.get('pass'):
              raise SystemExit('KAYAS direct-v17 smoke failed: ' + json.dumps(result, ensure_ascii=False))
          print('KAYAS_DIRECT_V17_SMOKE=PASS')
          PY
