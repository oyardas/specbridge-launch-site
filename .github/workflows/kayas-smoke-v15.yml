name: Install KAYAS Authoritative Same-Origin Bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-smoke-v15.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-authoritative-bundle-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, verify, install and record result
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/kayas-install kayas/walkthrough/src
          EXPECTED_SIZE=1371713
          EXPECTED_SHA=003d42f6fa45b0d30edb7c20f59512b3455ceacc00783795b3c8196a3fa5227d
          TARGET=/tmp/kayas-install/source.js
          LOG=/tmp/kayas-install/attempts.log
          VALID=false
          : > "$LOG"

          for URL in \
            'https://drive.usercontent.google.com/download?id=19zW6DgqhSjWrRFnxDjs58NhTa5aykdGc&export=download&authuser=0&confirm=t' \
            'https://drive.google.com/uc?export=download&id=19zW6DgqhSjWrRFnxDjs58NhTa5aykdGc&confirm=t'
          do
            rm -f "$TARGET" /tmp/kayas-install/headers.txt
            echo "URL=$URL" >> "$LOG"
            curl -L -sS --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              -D /tmp/kayas-install/headers.txt "$URL" -o "$TARGET"
            RC=$?
            SIZE=$(wc -c < "$TARGET" 2>/dev/null || echo 0)
            SHA=$(sha256sum "$TARGET" 2>/dev/null | awk '{print $1}')
            TYPE=$(file -b --mime-type "$TARGET" 2>/dev/null || echo unknown)
            echo "curl_rc=$RC size=$SIZE sha=$SHA type=$TYPE" >> "$LOG"
            cat /tmp/kayas-install/headers.txt >> "$LOG" 2>/dev/null || true
            echo >> "$LOG"
            if [ "$RC" -eq 0 ] && [ "$SIZE" -eq "$EXPECTED_SIZE" ] && [ "$SHA" = "$EXPECTED_SHA" ] && node --check "$TARGET" >/tmp/kayas-install/node.log 2>&1; then
              VALID=true
              break
            fi
          done

          if [ "$VALID" = true ]; then
            cp "$TARGET" kayas/walkthrough/src/kayas-v8-safe.bundle.js
            printf '\n%s\n%s\n%s\n%s\n' \
              "window.__KAYAS_MODEL_READY = true;" \
              "window.__KAYAS_MODEL_MODE = 'authoritative-v8-same-origin-v18';" \
              "window.__KAYAS_MODEL_SOURCE = 'same-origin';" \
              "window.dispatchEvent(new Event('resize'));" \
              >> kayas/walkthrough/src/kayas-v8-safe.bundle.js
            node --check kayas/walkthrough/src/kayas-v8-safe.bundle.js
            perl -0pi -e 's#<script defer src="(?:model-loader\.js|src/kayas-v8-safe\.bundle\.js|src/kayas-v10-enhanced\.bundle\.js)\?v=[^"]+"></script>#<script defer src="src/kayas-v8-safe.bundle.js?v=20260803-same-origin-v18"></script>#g' kayas/walkthrough/index.html
          fi

          ACTUAL_SIZE=$(wc -c < "$TARGET" 2>/dev/null || echo 0)
          ACTUAL_SHA=$(sha256sum "$TARGET" 2>/dev/null | awk '{print $1}')
          ATTEMPTS=$(tail -c 10000 "$LOG" | jq -Rs .)
          jq -n \
            --argjson valid "$VALID" \
            --arg expected_sha256 "$EXPECTED_SHA" \
            --arg actual_sha256 "$ACTUAL_SHA" \
            --argjson expected_size "$EXPECTED_SIZE" \
            --argjson actual_size "$ACTUAL_SIZE" \
            --argjson attempts "$ATTEMPTS" \
            --arg installed_path_exists "$(test -s kayas/walkthrough/src/kayas-v8-safe.bundle.js && echo true || echo false)" \
            --arg index_uses_same_origin "$(grep -q 'src/kayas-v8-safe.bundle.js?v=20260803-same-origin-v18' kayas/walkthrough/index.html && echo true || echo false)" \
            '{valid:$valid, expected_sha256:$expected_sha256, actual_sha256:$actual_sha256, expected_size:$expected_size, actual_size:$actual_size, attempts:$attempts, installed_path_exists:($installed_path_exists=="true"), index_uses_same_origin:($index_uses_same_origin=="true")}' \
            > kayas/walkthrough/authoritative-install-diagnostic.json
          cat kayas/walkthrough/authoritative-install-diagnostic.json

      - name: Commit diagnostic and runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/authoritative-install-diagnostic.json kayas/walkthrough/index.html
          if test -s kayas/walkthrough/src/kayas-v8-safe.bundle.js; then
            git add kayas/walkthrough/src/kayas-v8-safe.bundle.js
          fi
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Install authoritative KAYAS same-origin runtime and diagnostic [skip ci]'
          git push origin HEAD:main
