name: Extract KAYAS Renderer Diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-render-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract renderer and scene construction snippets
        shell: bash
        run: |
          set -euo pipefail
          SRC=kayas/walkthrough/src/kayas-v8-safe.bundle.js
          test -s "$SRC"
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('kayas/walkthrough/src/kayas-v8-safe.bundle.js').read_text(encoding='utf-8',errors='replace')
          terms=[
            'WebGLRenderer','renderer.shadowMap','toneMapping','outputColorSpace','new THREE.Scene',
            'scene.background','AmbientLight','HemisphereLight','DirectionalLight','PointLight',
            'MeshStandardMaterial','MeshPhysicalMaterial','MeshPhongMaterial','OrbitControls',
            'PerspectiveCamera','OrthographicCamera','setPixelRatio','setClearColor','ACESFilmicToneMapping'
          ]
          out=[]
          for term in terms:
            out.append(f'===== {term} =====')
            positions=[m.start() for m in re.finditer(re.escape(term),src)]
            out.append(f'COUNT={len(positions)}')
            for i,pos in enumerate(positions[:12],1):
              a=max(0,pos-500); b=min(len(src),pos+900)
              snippet=src[a:b].replace('\r','')
              out.append(f'--- {i} @ {pos} ---\n{snippet}')
          Path('kayas/walkthrough/render-diagnostic.txt').write_text('\n\n'.join(out),encoding='utf-8')
          print('DIAGNOSTIC_BYTES',Path('kayas/walkthrough/render-diagnostic.txt').stat().st_size)
          PY
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/render-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record KAYAS renderer diagnostics [skip ci]'
          git push origin HEAD:main
