name: Normalize KAYAS v20.2 Single Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-install-v20-1-runtime.yml
      - kayas/walkthrough/install-v20-1-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-v20-2-single-runtime
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < kayas/walkthrough/v20-runtime.js)" -eq 34682
          test "$(sha256sum kayas/walkthrough/v20-runtime.js | awk '{print $1}')" = cff5cf706d44dc9aaf05765b4abaf1bdfcd35c6e845dd7eae4d8ae308c4eab3b
          node --check kayas/walkthrough/v20-runtime.js

      - name: Remove duplicate visual runtime and rotate cache keys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('kayas/walkthrough/index.html')
          html = index.read_text(encoding='utf-8')
          html, runtime_count = re.subn(
              r'<script defer id="kayas-v19-runtime" src="v19-runtime\.js\?v=[^"]+"></script>',
              '<script defer id="kayas-v20-runtime" src="v20-runtime.js?v=20260803-v20-2-cinematic"></script>',
              html,
          )
          if runtime_count != 1:
              raise SystemExit(f'Expected one legacy direct runtime, found {runtime_count}')
          html = re.sub(r'v20-enhancements\.css\?v=[^"\']+', 'v20-enhancements.css?v=20260803-v20-2-cinematic', html)
          html = re.sub(r'app-shell\.js\?v=[^"\']+', 'app-shell.js?v=20260803-v20-2-cinematic', html)
          if html.count('id="kayas-v20-runtime"') != 1:
              raise SystemExit('Expected exactly one active v20 runtime script')
          if 'id="kayas-v19-runtime"' in html:
              raise SystemExit('Legacy direct runtime remains')
          index.write_text(html, encoding='utf-8')

          shell = Path('kayas/walkthrough/app-shell.js')
          text = shell.read_text(encoding='utf-8')
          text = re.sub(r'v20-enhancements\.css\?v=[^"\']+', 'v20-enhancements.css?v=20260803-v20-2-cinematic', text)
          text = re.sub(r'v20-runtime\.js\?v=[^"\']+', 'v20-runtime.js?v=20260803-v20-2-cinematic', text)
          shell.write_text(text, encoding='utf-8')
          PY
          node --check kayas/walkthrough/app-shell.js
          grep -q 'id="kayas-v20-runtime" src="v20-runtime.js?v=20260803-v20-2-cinematic"' kayas/walkthrough/index.html
          test "$(grep -o 'id="kayas-v20-runtime"' kayas/walkthrough/index.html | wc -l)" -eq 1
          ! grep -q 'id="kayas-v19-runtime"' kayas/walkthrough/index.html
          grep -q 'app-shell.js?v=20260803-v20-2-cinematic' kayas/walkthrough/index.html

      - name: Commit normalized loading order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/index.html kayas/walkthrough/app-shell.js
          if git diff --cached --quiet; then
            echo 'KAYAS v20.2 loading order already normalized.'
            exit 0
          fi
          git commit -m 'Normalize KAYAS v20.2 to one cinematic runtime [skip ci]'
          git push origin HEAD:main
