name: Activate KAYAS v19 Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-activate-v19.yml
      - kayas/walkthrough/activate-v19-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build authoritative geometry-locked engine bridge
        shell: bash
        run: |
          set -euo pipefail
          SRC=kayas/walkthrough/src/kayas-v8-safe.bundle.js
          test -s "$SRC"
          head -c 1371713 "$SRC" > /tmp/kayas-v8-source.js
          printf '%s  %s\n' \
            '003d42f6fa45b0d30edb7c20f59512b3455ceacc00783795b3c8196a3fa5227d' \
            '/tmp/kayas-v8-source.js' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/kayas-v8-source.js').read_text(encoding='utf-8')
          needle = """const renderer = new WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
          renderer.setPixelRatio(Math.min(devicePixelRatio, 1.65));
          renderer.shadowMap.enabled = false;
          renderer.outputColorSpace = SRGBColorSpace;
          renderer.toneMapping = ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1;
          const scene = new Scene();
          const camera = new PerspectiveCamera(50, 1, .1, 1000);"""
          if source.count(needle) != 1:
              raise SystemExit(f'renderer bootstrap count={source.count(needle)}')
          replacement = needle + """
          window.__KAYAS_RENDERER__ = renderer;
          window.__KAYAS_SCENE__ = scene;
          window.__KAYAS_CAMERA__ = camera;"""
          source = source.replace(needle, replacement, 1)
          source += """

          window.__KAYAS_MODEL_READY = true;
          window.__KAYAS_MODEL_MODE = 'authoritative-v8-geometry-exposed-v19';
          window.__KAYAS_MODEL_SOURCE = 'same-origin-exposed-v19';
          window.dispatchEvent(new Event('resize'));
          """
          target = Path('kayas/walkthrough/src/kayas-v8-exposed-v19.bundle.js')
          target.write_text(source, encoding='utf-8')
          PY
          node --check kayas/walkthrough/src/kayas-v8-exposed-v19.bundle.js

      - name: Activate cache-busted v19 assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('kayas/walkthrough/index.html')
          text=path.read_text(encoding='utf-8')
          text,count_shell=re.subn(
              r'<script defer src="app-shell\.js\?v=[^"]+"></script>',
              '<script defer src="app-shell.js?v=20260803-v19-engine2"></script>',
              text,
          )
          model_pattern=r'<script defer src="src/(?:kayas-v8-safe|kayas-v8-exposed-v19|kayas-v19-enhanced|kayas-v10-enhanced)\.bundle\.js\?v=[^"]+"></script>'
          text,count_model=re.subn(
              model_pattern,
              '<script defer src="src/kayas-v8-exposed-v19.bundle.js?v=20260803-v19-engine2"></script>',
              text,
          )
          if count_shell != 1 or count_model != 1:
              raise SystemExit(f'reference mismatch shell={count_shell} model={count_model}')
          path.write_text(text,encoding='utf-8')
          PY
          grep -q 'app-shell.js?v=20260803-v19-engine2' kayas/walkthrough/index.html
          grep -q 'kayas-v8-exposed-v19.bundle.js?v=20260803-v19-engine2' kayas/walkthrough/index.html
          node --check kayas/walkthrough/app-shell.js
          node --check kayas/walkthrough/v19-runtime.js
          test -s kayas/walkthrough/v19-enhancements.css

      - name: Commit activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/index.html kayas/walkthrough/src/kayas-v8-exposed-v19.bundle.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate geometry-locked KAYAS v19 engine bridge [skip ci]'
          git push origin HEAD:main
