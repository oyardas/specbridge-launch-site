name: Activate KAYAS v19 Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-activate-v19.yml
      - kayas/walkthrough/activate-v19-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate cache-busted v19 shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('kayas/walkthrough/index.html')
          text=path.read_text(encoding='utf-8')
          text,count=re.subn(
              r'<script defer src="app-shell\.js\?v=[^"]+"></script>',
              '<script defer src="app-shell.js?v=20260803-v19"></script>',
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one app-shell reference, found {count}')
          path.write_text(text,encoding='utf-8')
          PY
          grep -q 'app-shell.js?v=20260803-v19' kayas/walkthrough/index.html
          node --check kayas/walkthrough/app-shell.js
          node --check kayas/walkthrough/v19-runtime.js
          test -s kayas/walkthrough/v19-enhancements.css
      - name: Commit activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate cache-busted KAYAS v19 shell [skip ci]'
          git push origin HEAD:main
