name: Publish KAYAS v19 Final Cache Keys

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kayas-activate-v19.yml
      - kayas/walkthrough/activate-v19-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayas-v19-final-cache
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final asset versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('kayas/walkthrough/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              r'styles\.css\?v=[^"<]+': 'styles.css?v=20260803-v19-final',
              r'v19-enhancements\.css\?v=[^"<]+': 'v19-enhancements.css?v=20260803-v19-final',
              r'gallery_manifest\.js\?v=[^"<]+': 'gallery_manifest.js?v=20260803-v19-final',
              r'model-loader-v19\.js\?v=[^"<]+': 'model-loader-v19.js?v=20260803-v19-final',
              r'v19-runtime\.js\?v=[^"<]+': 'v19-runtime.js?v=20260803-v19-final',
              r'app-shell\.js\?v=[^"<]+': 'app-shell.js?v=20260803-v19-final',
          }
          for pattern, replacement in replacements.items():
              text, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise SystemExit(f'Expected one match for {pattern}, found {count}')
          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'styles.css?v=20260803-v19-final' kayas/walkthrough/index.html
          grep -q 'v19-enhancements.css?v=20260803-v19-final' kayas/walkthrough/index.html
          grep -q 'gallery_manifest.js?v=20260803-v19-final' kayas/walkthrough/index.html
          grep -q 'model-loader-v19.js?v=20260803-v19-final' kayas/walkthrough/index.html
          grep -q 'v19-runtime.js?v=20260803-v19-final' kayas/walkthrough/index.html
          grep -q 'app-shell.js?v=20260803-v19-final' kayas/walkthrough/index.html
          node --check kayas/walkthrough/app-shell.js
          node --check kayas/walkthrough/model-loader-v19.js
          node --check kayas/walkthrough/v19-runtime.js

      - name: Commit final cache keys
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kayas/walkthrough/index.html
          if git diff --cached --quiet; then
            echo 'Final cache keys already active.'
            exit 0
          fi
          git commit -m 'Publish KAYAS v19 final cache keys [skip ci]'
          git push origin HEAD:main
