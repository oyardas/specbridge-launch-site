'01':['Veri merkezi yatırımı; fiziksel tesis, enerji, bağlantı, IT platformları ve işletme kabiliyetinin birlikte ekonomik değer üretmesidir.','Başarı yalnız bina veya kabinet sayısıyla değil; kullanılabilir güç, satılabilir kW/MW, doluluk, SLA ve müşteri talebiyle ölçülür.','Colocation, enterprise/private DC, hyperscale/wholesale, cloud ve managed services.','Enerji ve saha hazırlanır → MEP/IT kurulur → kapasite sözleşmeyle tahsis edilir → operasyon ve SLA üzerinden gelir üretilir.'],
'02':['Geleneksel, mikro-modül ve prefabrik modüler yaklaşımlar veri merkezi fiziksel altyapısının farklı kurulma biçimleridir.','Kurulum süresi, standardizasyon, saha riski, CAPEX zamanlaması ve büyüme yöntemini etkiler.','Geleneksel site-built, mikro-modül/pod, prefabrik modüler ve containerized çözümler.','Ortak güç/soğutma/fiber omurgasına tekrarlanabilir modüller bağlanır; talep büyüdükçe yeni modüller devreye alınır.'],

'05':['PDU ve busway, UPS çıkışındaki gücü salon ve kabinet seviyesine taşıyan son-metre dağıtım katmanıdır.','Rack yoğunluğu, A/B besleme, ölçüm, bakım ve müşteri bazlı enerji faturalamasını etkiler.','Floor PDU, overhead busway, tap-off box, rack PDU; basic, metered ve intelligent PDU.','UPS çıkışı busway/kabloyla dağıtılır → tap-off rack hattını besler → rack PDU cihazlara A/B enerji sağlar ve tüketimi ölçer.'],
'06':['Akü ve enerji depolama, elektrik enerjisinin daha sonra kullanılmak üzere saklanmasıdır.','UPS bataryası kısa ride-through, BESS ise enerji esnekliği, peak shaving ve grid/yenilenebilir kullanım senaryoları sağlar.','VRLA, Li-ion/LFP UPS bataryaları; cabinet/container BESS, PCS/inverter, BMS ve EMS.','Sistem şarj olur → SoC ve güvenlik izlenir → ihtiyaçta inverter üzerinden yük veya şebekeye kontrollü güç verir.'],
'07':['Jeneratör, şebeke uzun süre kullanılamadığında kritik yükleri besleyen standby güç katmanıdır.','UPS’in kısa ride-through süresinden sonra iş sürekliliğini saatler veya yakıt sürdükçe devam ettirir.','Diesel/gas genset, N+1 yedeklilik, ATS/şalt ve merkezi/day-tank yakıt sistemleri.','Şebeke kaybolur → UPS yükü taşır → jeneratör start/stabilize olur → ATS/şalt yükü jeneratöre aktarır.'],
'08':['Soğutma, IT ekipmanının ürettiği ısının hava, su veya dielektrik sıvı üzerinden uzaklaştırılmasıdır.','Enerji tüketimi, rack yoğunluğu, PUE/WUE, güvenilirlik ve AI/HPC kapasitesini belirler.','In-row/CRAH/CRAC, chiller, dry/adiabatic cooling, rear-door HX, direct-to-chip + CDU ve immersion.','IT ısısı kapalı devreye aktarılır → eşanjör/chiller ısıyı dışarı atar → soğutulmuş akışkan IT’ye döner; doğal su IT devresine doğrudan bağlanmaz.'],
'09':['Fiber ve ağ altyapısı, operatörler, internet, müşteriler ve rack/fabric arasında yüksek hızlı bağlantı sağlar.','Carrier çeşitliliği, düşük gecikme, cloud/colo ve AI fabric kapasitesi buna bağlıdır.','MMR, cross-connect, ODF, spine-leaf, EVPN/VXLAN, OOB; 100G/400G/800G ve 1.6T gelişimi.','Carrier fiberi bağımsız güzergâhlardan MMR’a gelir → core/spine’e bağlanır → leaf üzerinden compute/storage/rack’lere dağıtılır.'],
'10':['Cloud, compute/storage/network kaynaklarının otomasyon ve self-service ile hizmet olarak sunulmasıdır.','Fiziksel kapasiteyi IaaS/private cloud/managed hizmet gelirine dönüştürür.','Private cloud, hybrid cloud, managed cloud; IaaS, PaaS, DBaaS ve container/Kubernetes.','Kaynaklar havuzlanır → katalog/quota/workflow uygulanır → tenant portalı tüketir → metering/SLA ile hizmet yönetilir.'],
'11':['Colocation, müşterinin IT ekipmanını üçüncü taraf veri merkezinde güç, soğutma, bağlantı ve güvenlik hizmetleriyle barındırmasıdır.','Gelir rack sayısından çok contracted kW/MW, bağlantı, SLA ve ek hizmetlerden oluşur.','Retail colo, wholesale/dedicated hall, cage/private suite, cross-connect ve remote hands.','Alan + güç + bağlantı tahsis edilir → tesis sürekliliği sağlar → SLA, ölçüm ve destek hizmetleri faturalandırılır.'],
'12':['Tiering dayanıklılık/topolojiyi, standartlar gereklilikleri, commissioning ise kurulan sistemlerin birlikte doğrulanmasını tanımlar.','Yedekli ekipman tek başına güvenilir tesis üretmez; tasarım, kurulum, test ve operasyon kanıtı gerekir.','Uptime Tier I–IV, ANSI/TIA-942, EN 50600/TS EN 50600; FAT, SAT, IST ve ORR.','Gereksinim tasarıma çevrilir → FAT/SAT doğrular → IST arıza/geçiş senaryolarını sınar → operasyon ekibine kontrollü devredilir.'],

'14':['Sanallaştırma fiziksel kaynakları mantıksal iş yüklerine ayırır; yedeklilik arıza etkisini sınırlar; büyüme kapasiteyi kontrollü artırır.','Bakım, node arızası veya talep artışında hizmetin devamını ve daha verimli kaynak kullanımını sağlar.','Hypervisor, VM/container, HA cluster, live migration, replication, scale-up/scale-out.','İş yükleri havuzda çalışır → HA arızayı algılar → iş yükü sağlıklı node’a taşınır/yeniden başlar → talepte kaynak eklenir.'],
'15':['Backup geri getirilebilir veri kopyasıdır; Disaster Recovery kritik hizmeti büyük kesinti/site kaybı sonrası yeniden çalıştırma kabiliyetidir.','Ransomware, kullanıcı hatası, donanım arızası ve felaketlerde veri/iş sürekliliğinin son savunma katmanıdır.','Full/incremental, immutable/object-lock, air-gap, replication, remote DR ve cloud backup.','Veri kopyalanır → en az bir kopya değiştirilemez tutulur → restore test edilir → felakette RPO/RTO’ya göre DR devreye alınır.'],
'16':['DCIM/BMS/EMS/NMS tesis ve IT telemetrisini toplar; NOC/SOC operasyon ve güvenlik olaylarını yönetir.','Enerji, soğutma, kapasite, ağ ve güvenlik olaylarını bütünsel görünürlüğe dönüştürür.','DCIM, BMS, EMS, NMS, NOC, SOC ve SIEM/automation entegrasyonları.','Sensör/platform verileri merkezi katmana akar → alarm/olay korele edilir → operatör veya kontrollü otomasyon aksiyon alır.'],
'17':['Fiziksel güvenlik tesis/oda/rack erişimini; siber güvenlik ağ, kimlik, sistem ve veriyi korur.','Güven; çevreden rack’e, kimlikten SOC müdahalesine kadar katmanlı kontrole dayanır.','Perimeter, CCTV, mantrap, access control; IAM/MFA/PAM, segmentation, firewall, SIEM/SOC ve Zero Trust.','Kimlik doğrulanır → en az yetkiyle erişim verilir → trafik/olay izlenir → anomalide containment ve incident response çalışır.'],
'18':['AI/GPU cluster, çok sayıda GPU sunucusunun yüksek hızlı fabric, yüksek performanslı storage ve yoğun güç/soğutma ile tek küme olarak çalışmasıdır.','AI training ve büyük inference, klasik rack yoğunluğunun üzerine çıkarak elektrik, cooling ve fiber tasarımını birlikte değiştirir.','GPU compute node, 800G-class fabric, parallel storage, scheduler/orchestration, direct-to-chip/CDU.','Veri storage’dan GPU node’larına taşınır → GPU’lar fabric üzerinden paralel hesaplar → scheduler paylaştırır → güç/soğutma telemetrisi yoğunluğu kontrol eder.'],
'19':['Sürdürülebilir veri merkezi enerji, su, karbon, malzeme ve yaşam döngüsü etkilerini ölçüp azaltmayı hedefler.','Enerji maliyeti, regülasyon, ESG beklentisi, su riski ve uzun vadeli verimliliği etkiler.','PUE, WUE, CUE/karbon görünürlüğü, yenilenebilir enerji, heat reuse ve free cooling.','Enerji/su/karbon ölçülür → kayıplar belirlenir → verimlilik/yenilenebilir/ısı geri kullanım yatırımları önceliklendirilir.'],
'20':['Edge veri merkezi, compute/storage/network kapasitesini kullanıcıya, cihaza veya veri kaynağına daha yakın konumlandırır.','Düşük gecikme, yerel veri işleme ve bağlantı bağımlılığını azaltma gereken senaryolarda önemlidir.','Regional edge, metro edge, telco edge, enterprise/industrial micro-edge.','Veri yakın edge düğümünde işlenir → kritik sonuç yerelde üretilir → merkezi DC/cloud ile yönetim ve veri senkronizasyonu sürer.'],

function start(){const g=window.KAYAS_GUIDE;if(!g||!Array.isArray(g.chapters)){document.getElementById('body').innerHTML='<p>guide-data.js yüklenemedi.</p>';return}const nav=document.getElementById('nav'),body=document.getElementById('body'),title=document.getElementById('title'),kicker=document.getElementById('kicker'),primer=document.getElementById('primer'),vis=document.getElementById('visual'),q=document.getElementById('q'),reader=document.getElementById('reader');let idx=Math.max(0,g.chapters.findIndex(c=>c.id==='01')),filter='';function visible(){const f=filter.toLocaleLowerCase('tr-TR');return g.chapters.filter(c=>!f||(c.title+' '+c.blocks.map(b=>b.text||((b.rows||[]).flat().join(' '))).join(' ')).toLocaleLowerCase('tr-TR').includes(f))}function navBuild(){nav.innerHTML='';for(const c of visible()){const i=g.chapters.indexOf(c),b=document.createElement('button');b.className=i===idx?'active':'';b.innerHTML='<b>'+esc(c.id)+'</b><span>'+esc(c.title)+'</span>';b.onclick=()=>{idx=i;render();document.getElementById('reader').scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)}}function render(){const c=g.chapters[idx];kicker.textContent=(c.kind==='appendix'?'Ek':'Bölüm')+' '+c.id.replace('EK-','');title.textContent=c.title;const p=P[c.id]||['Bu bölüm '+c.title+' konusunun veri merkezi bağlamını açıklar.','Konu; süreklilik, kapasite, maliyet veya operasyonu doğrudan etkiler.','Başlıca türler ve bileşenler bölüm içindeki teknik içerikte sınıflandırılmıştır.','Girdi ilgili altyapı/servis katmanında işlenir, izlenir ve güvenilir çıktıya dönüştürülür.'];primer.innerHTML='<div class="primer-grid">'+[['Nedir?',p[0]],['Veri merkezindeki önemi',p[1]],['Başlıca türleri / bileşenleri',p[2]],['Basit çalışma mantığı',p[3]]].map((x,i)=>'<div class="primer-card" style="--d:'+i*80+'ms"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div>').join('')+'</div>';vis.innerHTML=c.kind==='chapter'?visual(c.id,c.title):'';body.innerHTML=blocks(c.blocks);reader.classList.remove('visible');requestAnimationFrame(()=>reader.classList.add('visible'));setTimeout(()=>document.querySelectorAll('.live-visual,.reveal').forEach(x=>x.classList.add('visible')),60);navBuild()}function step(d){const v=visible();let pos=v.findIndex(c=>g.chapters.indexOf(c)===idx);if(pos<0)pos=0;pos=(pos+d+v.length)%v.length;idx=g.chapters.indexOf(v[pos]);render()}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);q.oninput=()=>{filter=q.value.trim();navBuild()};render()}
