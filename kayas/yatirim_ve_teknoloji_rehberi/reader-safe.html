*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#edf3f6;color:var(--ink)}a{color:inherit}.top{position:sticky;top:0;z-index:80;height:66px;background:rgba(13,39,66,.98);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 18px rgba(0,0,0,.16)}.top strong{font-size:15px}.top small{display:block;color:#b8c9d8;margin-top:2px}.top a{font-size:12px;color:#dce9f4;text-decoration:none}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1580px;margin:auto;min-height:calc(100vh - 66px)}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}.side h2{margin:5px 8px 12px;color:var(--navy);font-size:19px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.07em;color:var(--teal)}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;margin-bottom:12px}.nav button{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr);gap:7px;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 8px;color:#536878;cursor:pointer}.nav button:hover,.nav button.active{background:#edf6f7;color:var(--navy)}.nav b{color:var(--teal)}.nav span{font-size:12.2px;line-height:1.35}.main{padding:26px;min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:24px;padding:28px;margin-bottom:20px;overflow:hidden}.hero h1{font-size:36px;line-height:1.06;margin:8px 0 12px;color:var(--navy)}.hero p{line-height:1.65;color:#52697a}.hero-photo{border-radius:18px;overflow:hidden;min-height:300px;position:relative;background:#dfe9ee}.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}.hero-photo:after{content:"Konsept görsel · uygulama projesi değildir";position:abso ng:18px 24px 0}.visual-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr);gap:14px}.live-visual,.chapter-photo{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,#f6fafb);overflow:hidden}.live-visual{padding:18px}.visual-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.visual-title h3{margin:0;color:var(--navy);font-size:19px}.visual-title span{font-size:9.5px;color:var(--teal);font-weight:850}.flow{display:flex;align-items:stretch;gap:7px;overflow-x:auto;padding:3px 1px 8px}.node{flex:1 1 0;min-width:112px;border:1px solid #d7e4ea;border-radius:13px;padding:12px;background:#fff;opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .7s var(--ease);transition-delay:var(--d,0ms)}.live-visual.visible .node{opacity:1;transform:none}.node b{display:block;color:var(--navy);font-size:11.5px;margin-bottom:5px}.node span{display:block;color:#647988;font-size:10px;line-height:1.4}.arrow{flex:0 0 20px;display:grid;place-items:center;color:var(--cyan);font-size:20px;font-weight:900;animation:arrow 1.45s ease-in-out infinite}.chapter-photo{position:relative;min-height:320px;background:#e5edf1}.chapter-photo img{width:100%;height:100%;min-height:320px;display:block;object-fit:cover;opacity:0;transition:opacity .75s ease .18s}.chapter-photo.visible img{opacity:1}.chapter-photo .cap{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(7,28,48,.82);color:#fff;border-radius:10px;padding:9px 10px;font-size:10px;line-height:1.4}.visual-note{margin:10px 2px 0;font-size:10.5px;color:#6b7f8d;line-height:1.5}.body{padding:22px 24px 34px}.body h3{color:var(--navy);font-size:20px;margin:28px 0 10px}.body p{font-size:14px;line-height:1.72;color:#43596b}.body ul{line-height:1.67}.body li{margin:5px 0}.caption{font-size:11px!important;color:#7c8e9b!important;font-style:italic}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0 22px}.table-wrap table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}.table-wrap th,.table-wrap td{padding:10px 12px;border-bottom:1px solid #e8eef2;vertical-align:top;line-height:1.45}.table-wrap th{background:#f0f6f8;color:var(--navy);text-align:left;position:sticky;top:0}.auth{max-width:680px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);text-align:center}.auth h1{color:var(--navy)}.auth a{display:inline-block;margin-top:10px;padding:11px 16px;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none}.reveal{opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .68s var(--ease)}.reveal.visible{opacity:1;transform:none}@keyframes arrow{0%,100%{transform:translateX(0);opacity:.38}50%{transform:translateX(5px);opacity:1}}@media(max-width:1120px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.primer-grid{grid-template-columns:repeat(2,1fr)}.visual-grid{grid-template-columns:1fr}}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:relative;top:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}.primer-grid{grid-template-columns:1fr}.hero h1{font-size:29px}.reader-head{align-items:flex-start;flex-direction:column}.chapter-photo{min-height:240px}.chapter-photo img{min-height:240px}}@media print{.top,.side,.actions,.notice{display:none!important}.shell{display:block}.main{padding:0}.panel{box-shadow:none;border:0}.hero{display:block}.hero-photo{margin-top:18px}.reveal,.primer-card,.node,.chapter-photo img{opacity:1!important;transform:none!important}.arrow{animation:none}.table-wrap{overflow:visible}.table-wrap table{min-width:0}}

<script>

const KEY='kayas_walkthrough_auth_until';let until=0;try{until=Number(localStorage.getItem(KEY)||0)}catch(_){until=0}
if(until<=Date.now()){document.getElementById('app').innerHTML='<div class="auth"><div class="eyebrow">KAYAŞ INVESTOR PORTAL</div><h1>Portal oturumu gerekli</h1><p>Önce KAYAŞ ana portalına giriş yapın. Ardından Yatırım Rehberi bağlantısını tekrar açın.</p><a href="../">KAYAŞ ana portalına dön</a></div>';return}
document.getElementById('app').innerHTML='<header class="top"><div><strong>KAYAŞ · Görsel Yatırım ve Teknoloji Rehberi</strong><small>Illustrated live reader · v4.5</small></div><a href="../">← KAYAŞ ana portalı</a></header><div class="shell"><aside class="side"><div class="eyebrow">KAYAŞ-DC-GUIDE</div><h2>İçindekiler</h2><input id="q" class="search" type="search" placeholder="Bölüm veya teknoloji ara…"><nav id="nav" class="nav"></nav></aside><main class="main"><section class="hero panel reveal"><div><div class="eyebrow">KAYAŞ VERİ MERKEZİ</div><h1>Yatırım, tasarım, teknoloji ve gelecek için görsel karar rehberi</h1><p>Her bölümde temel açıklama, veri merkezindeki önemi, başlıca türleri, basit çalışma mantığı, animasyonlu teknik akış ve KAYAŞ konsept görseli birlikte sunulur.</p><div class="metrics"><div class="metric"><b data-count="206">206</b><span>Faz-1 IT kabinet</span></div><div class="metric"><b>1.972 MW</b><span>IT nameplate ön fizibilite</span></div><div class="metric"><b>7 kW</b><span>Standart kabinet</span></div><div class="metric"><b>10</b><span>AI/HPC sıvı kabinet</span></div><div class="metric"><b>≈2.000</b><span>Uzun vadeli vizyon</span></div><div class="metric"><b>Tier III</b><span>Hedef; sertifika değildir</span></div></div></div><div class="hero-photo"><img src="../assets/gallery/kayas_concept_09_datahall.webp" alt="KAYAŞ veri merkezi konsept görseli"></div></section><div class="notice reveal"><strong>Görsel sürüm:</strong> Bu production reader, mevcut rehber metnini korurken her bölümün başına öğretici kartlar, animasyonlu konu diyagramı ve bölümle ilişkili KAYAŞ konsept görseli ekler. Zoom/pan kullanılmaz.</div><section class="reader panel reveal"><div class="reader-head"><div><div class="eyebrow" id="kicker">Bölüm 01</div><h2 id="title">Yatırım ve Pazar Görünümü</h2></div><div class="actions"><button id="prev">← Önceki</button><button id="next">Sonraki →</button></div></div><div id="primer" class="primer"></div><div id="visual" class="visual-wrap"></div><article id="body" class="body"><p>Rehber verisi yükleniyor…</p></article></section></main></div>';
const PR={
'01':['Veri merkezi yatırımı; fiziksel tesis, enerji, bağlantı, IT platformları ve işletme kabiliyetinin birlikte ekonomik değer üretmesidir.','Yatırım başarısı kabinet sayısından çok kullanılabilir güç, satılabilir kW/MW, doluluk, SLA ve müşteri talebiyle ölçülür.','Colocation, enterprise/private DC, hyperscale/wholesale, cloud ve managed-service modelleri.','Enerji ve saha hazırlanır → MEP/IT kurulur → kapasite sözleşmeyle tahsis edilir → operasyon ve SLA üzerinden gelir üretilir.'],
'02':['Geleneksel, mikro-modül ve prefabrik modüler yaklaşımlar veri merkezi fiziksel altyapısının farklı kurulum ve ölçekleme yöntemleridir.','Kurulum süresi, standardizasyon, saha riski, CAPEX zamanlaması ve kapasite ekleme biçimini doğrudan etkiler.','Geleneksel site-built, mikro-modül/pod, prefabrik modüler ve konteyner/complete module.','Ortak güç-soğutma-fiber omurgasına tekrarlanabilir IT/MEP blokları bağlanır; talep büyüdükçe yeni modüller devreye alınır.'],
'03':['Şebekeden IT rack’ine kadar elektriğin güvenli, seçici, ölçülebilir ve yedekli biçimde taşındığı güç zinciridir.','Güç yolu tasarımı satılabilir MW, Tier hedefi, bakım ve arıza etkisini belirler.','OG/AG giriş, trafo, şalt, UPS, jeneratör, PDU/busway, rack PDU, A/B yol ve ölçüm.','Şebeke enerjisi dağıtılır → UPS kısa kesintiyi köprüler → jeneratör uzun kesintide yükü devralır → A/B yollar IT yükünü besler.'],
'04':['UPS (Uninterruptible Power Supply), şebeke bozulması veya kesilmesi sırasında kritik IT yükünü kesintisiz besleyen güç elektroniği sistemidir.','Milisaniye seviyesindeki kesintilerin sunucu, storage ve ağ cihazlarını durdurmasını önler; jeneratör devreye girene kadar ride-through sağlar.','Static double-conversion UPS, modular UPS, rotary/DRUPS; VRLA, Li-ion/LFP veya kinetik enerji depolama.','Şebeke normalde UPS üzerinden yükü besler → kesintide inverter depolamadan devam eder → jeneratör stabil hale gelince uzun süreli kaynak devralır.'],
'05':['PDU, busway ve rack PDU; UPS çıkışındaki gücü salon ve kabinet seviyesine taşıyan son-metre dağıtım katmanıdır.','Rack yoğunluğu, A/B besleme, ölçüm, bakım esnekliği ve müşteri bazlı enerji faturalamasının temelidir.','Floor PDU, overhead busway, tap-off box; basic, metered ve intelligent rack PDU.','UPS/PDU çıkışı busway veya kabloyla dağıtılır → tap-off rack hattını besler → A/B rack PDU cihaz girişlerine enerji sağlar ve tüketimi ölçer.'],
'06':['Enerji depolama, elektrik enerjisinin batarya veya başka teknolojilerle daha sonra kullanılmak üzere saklanmasıdır.','UPS bataryası kısa süreli kesintisizliğe, BESS ise enerji esnekliği, peak shaving ve farklı şebeke kullanım senaryolarına hizmet eder.','VRLA, Li-ion/LFP UPS bataryaları; cabinet/container BESS, PCS/inverter, BMS ve EMS.','Sistem şarj olur → SoC ve güvenlik izlenir → ihtiyaç anında inverter üzerinden yük veya şebekeye kontrollü güç verir.'],
'07':['Jeneratör, şebeke uzun süre kullanılamadığında kritik veri merkezi yüklerini besleyen standby güç katmanıdır.','UPS’in kısa ride-through süresinden sonra iş sürekliliğini saatler veya yakıt sürdükçe devam ettirir.','Diesel/gas genset, N+1 yedeklilik, ATS/STS/şalt entegrasyonu ve yakıt sistemleri.','Şebeke kaybolur → UPS yükü taşır → jeneratör start eder ve stabilize olur → şalt/ATS yükü jeneratöre geçirir.'],
'08':['Soğutma, IT ekipmanının ürettiği ısının hava, su veya dielektrik sıvı üzerinden uzaklaştırılması sürecidir.','Enerji tüketimi, rack yoğunluğu, PUE/WUE, IT güvenilirliği ve AI/HPC kapasitesini belirleyen ana MEP sistemidir.','In-row/CRAH/CRAC, chiller, dry/adiabatic cooling, rear-door HX, direct-to-chip + CDU ve immersion.','IT ısısı kapalı devreye aktarılır → eşanjör/chiller ısıyı dışarı atar → soğutulmuş akışkan IT tarafına döner; doğal su IT devresine doğrudan bağlanmaz.'],
'09':['Fiber ve ağ altyapısı, operatörler, internet, müşteriler ve rack/fabric arasında yüksek hızlı optik bağlantı sağlar.','Carrier çeşitliliği, düşük gecikme, cloud/colo ürünleri ve AI fabric kapasitesi doğrudan ağ tasarımına bağlıdır.','MMR, carrier cross-connect, ODF, spine-leaf, EVPN/VXLAN, OOB; 100G/400G/800G ve gelişen 1.6T.','Carrier fiberi bağımsız güzergâhlardan MMR’a gelir → core/spine’e bağlanır → leaf üzerinden compute/storage/rack’lere dağıtılır.'],
'10':['Cloud, compute, storage ve network kaynaklarının yazılım, otomasyon ve self-service katmanıyla hizmet olarak sunulmasıdır.','Fiziksel kapasiteyi daha yüksek katma değerli IaaS/private cloud/managed hizmet gelirine dönüştürür.','Private cloud, hybrid cloud, managed cloud; IaaS, PaaS, DBaaS ve container/Kubernetes servisleri.','Kaynaklar havuzlanır → cloud yönetimi katalog/quota/workflow uygular → tenant portalı kaynak tüketir → metering/SLA ile hizmet yönetilir.'],
'11':['Colocation, müşterinin IT ekipmanını üçüncü taraf veri merkezinde güç, soğutma, bağlantı ve güvenlik hizmetleriyle barındırmasıdır.','Gelir rack sayısından çok contracted kW/MW, bağlantı, SLA ve ek hizmetlerden oluşur.','Retail colo, wholesale/dedicated hall, cage/private suite, cross-connect, remote hands ve managed services.','Müşteriye alan + güç + bağlantı tahsis edilir → tesis sürekliliği sağlar → SLA, ölçüm ve destek hizmetleri faturalandırılır.'],
'12':['Tiering dayanıklılık/topoloji seviyesini, standartlar gereklilikleri, commissioning ise kurulan sistemlerin birlikte doğrulanmasını tanımlar.','Yedekli ekipman tek başına güvenilir tesis üretmez; tasarım, kurulum, test ve operasyon kanıtı gerekir.','Uptime Tier I–IV, ANSI/TIA-942, EN 50600 ailesi; FAT, SAT, IST ve ORR.','Gereksinim tasarıma çevrilir → FAT/SAT doğrular → IST arıza/geçiş senaryolarını sınar → operasyon ekibine kontrollü devredilir.'],
'13':['Compute işlem gücünü, storage veriyi, HCI ise compute + software-defined storage + virtualization kaynaklarını node’larda birleştirir.','Cloud, sanallaştırma, veri tabanı ve enterprise uygulamaların performans, kapasite ve failure-domain temelini oluşturur.','Rack server, modular compute, SAN/NAS/object/SDS ve 2/3/4+ node HCI cluster.','CPU/RAM/disk kaynakları havuzlanır → sanallaştırma iş yüklerini çalıştırır → veri node’lara dağıtılır/replike edilir → yeni node ile kapasite büyür.'],
'14':['Sanallaştırma fiziksel kaynakları mantıksal iş yüklerine ayırır; yedeklilik arıza etkisini sınırlar; büyüme kapasiteyi kontrollü artırır.','Donanım arızası, bakım veya talep artışında hizmetin kesilmeden sürmesini ve kaynakların verimli kullanılmasını sağlar.','Hypervisor, VM/container, HA cluster, live migration, replication, scale-up/scale-out ve availability zone.','İş yükleri kaynak havuzunda çalışır → HA arızayı algılar → iş yükü sağlıklı node’a taşınır/yeniden başlatılır → kapasite yeni node ile büyür.'],
'15':['Backup geri getirilebilir veri kopyasıdır; Disaster Recovery kritik hizmeti büyük kesinti veya site kaybı sonrasında yeniden çalıştırma kabiliyetidir.','Ransomware, kullanıcı hatası, donanım arızası ve site felaketlerinde veri ve iş sürekliliğinin son savunma katmanıdır.','Full/incremental backup, immutable/object-lock, offline/air-gap, replication, remote DR ve cloud backup.','Veri kopyalanır → en az bir kopya değiştirilemez tutulur → restore test edilir → felakette RPO/RTO hedeflerine göre DR devreye alınır.'],
'16':['DCIM/BMS/EMS/NMS tesis ve IT telemetrisini toplar; NOC/SOC operasyon ve güvenlik olaylarını yöneten kontrol katmanlarıdır.','Enerji, soğutma, kapasite, ağ ve güvenlik olaylarını tekil cihaz ekranlarından çıkarıp bütünsel işletme görünürlüğüne dönüştürür.','DCIM, BMS, EMS, NMS, NOC, SOC, SIEM ve otomasyon entegrasyonları.','Sensör ve platform verileri merkezi katmana akar → alarm/olay korelasyonu yapılır → operatör aksiyon alır veya kontrollü otomasyon uygulanır.'],
'17':['Fiziksel güvenlik tesis/rack erişimini; siber güvenlik ağ, kimlik, sistem ve veriyi yetkisiz erişim ve saldırılardan korur.','Veri merkezi güveni insan girişinden privileged access ve SOC olay müdahalesine kadar katmanlı kontrole dayanır.','Perimeter/CCTV/mantrap/access control; IAM/MFA/PAM, segmentation, firewall, IDS/IPS, SIEM/SOC ve Zero Trust.','Kimlik doğrulanır → en az yetki uygulanır → trafik ve olaylar izlenir → anomalide containment ve incident response süreçleri çalışır.'],
'18':['AI/GPU cluster, çok sayıda GPU sunucusunun yüksek hızlı fabric, yüksek performanslı storage ve yoğun güç/soğutma ile tek küme olarak çalışmasıdır.','AI training ve büyük inference iş yükleri klasik rack yoğunluğunun üzerine çıkarak elektrik, cooling ve fiber tasarımını birlikte değiştirir.','GPU compute node, yüksek hızlı fabric, parallel storage, scheduler/orchestration, direct-to-chip/CDU ve high-density power zone.','Veri storage’dan GPU node’larına taşınır → GPU’lar fabric üzerinden paralel hesaplar → scheduler kaynakları paylaştırır → güç/soğutma telemetrisi yoğunluğu kontrol eder.'],
'19':['Sürdürülebilir veri merkezi; enerji, su, karbon, malzeme ve yaşam döngüsü etkilerini ölçerek daha düşük çevresel etki hedefler.','Enerji maliyeti, regülasyon, müşteri ESG beklentisi, su riski ve uzun vadeli işletme verimliliğini etkiler.','PUE, WUE, CUE/karbon görünürlüğü, yenilenebilir enerji, heat reuse, free cooling ve enerji yönetimi.','Enerji/su/karbon ölçülür → verimsizlikler belirlenir → tasarım ve operasyon iyileştirilir → KPI trendleri doğrulanır.'],
'20':['Edge veri merkezi, compute/storage/network kapasitesini kullanıcıya, cihaza veya veri kaynağına daha yakın konumlandırır.','Düşük gecikme, yerel veri işleme, OT/IoT ve dağıtık hizmetler için merkezi veri merkezini tamamlar.','Regional edge, metro edge, micro data center, telco edge ve on-prem edge.','İş yükü merkezi veya edge katmanına politika ile yerleştirilir → veri kaynağa yakın işlenir → merkez orkestrasyon, kapasite ve veri yaşam döngüsünü yönetir.'],
'21':['Kuantum hesaplama kuantum durumlarını kullanan farklı bir hesaplama yaklaşımıdır; post-quantum cryptography kuantum tehdidine dayanıklı kriptografi hazırlığıdır.','Kuantum donanımı bugün niş/araştırma alanıdır; PQC ve crypto-agility ise bugünden planlanması gereken güvenlik mimarisidir.','Superconducting/ion/photonic quantum yaklaşımları; PQC algoritmaları, crypto inventory ve crypto-agility.','Kuantum sistemleri özel fiziksel koşullarda çalışır; kurumlar mevcut şifreleme envanterini çıkarıp PQC geçişini kontrollü planlar.'],
'22':['CAPEX/OPEX/TCO modeli yatırımın başlangıç maliyetini, işletme giderlerini ve zaman içindeki toplam ekonomik etkisini birlikte değerlendirir.','Teknoloji seçimini yalnız ilk satın alma fiyatından çıkarıp enerji, bakım, kapasite, kullanım ve iskonto etkileriyle karşılaştırılabilir hale getirir.','CAPEX, OPEX, nominal toplam, discounted TCO; gelir/EBITDA/payback ayrı analiz.','Teklif ve varsayımlar normalize edilir → yıllık gider ve kapasite senaryoları modellenir → nakit akışı iskonto edilir → yatırım alternatifleri karşılaştırılır.'],
'23':['Yatırım yol haritası, hangi yatırımın bugün, hangisinin altyapısının bugün, hangisinin talep geldiğinde yapılacağını fazlara bağlar.','CAPEX’in erken ve atıl harcanmasını sınırlar; buna karşılık kritik altyapı rezervlerinin geç kalmasını önler.','Bugün yapılmalı, altyapısı bugün hazırlanmalı, müşteri talebiyle devreye alınmalı sınıfları.','Kanıt kapıları tamamlanır → Faz-1 kurulur → satış/doluluk/enerji tetikleri izlenir → doğrulanan talebe göre sonraki MW/rack fazı açılır.']};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function generic(c){return['Bu bölüm, '+c.title+' konusunun veri merkezi mimarisi ve yatırım kararındaki rolünü açıklar.','Konu; süreklilik, kapasite, maliyet, operasyon veya müşteri hizmet kalitesinden en az birini doğrudan etkiler.','Başlıca tür ve bileşenler bölüm içindeki teknik karşılaştırma ve tablolarda sınıflandırılır.','Girdi ilgili altyapı/servis katmanında işlenir, izlenir ve güvenilir biçimde hizmet çıktısına dönüştürülür.']}
function table(rows){if(!rows||!rows.length)return'';return'<div class="table-wrap"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i===0?'<th>':'<td>')+esc(c)+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>'}
function blocks(list){let h='',open=false;for(const b of list||[]){if(b.type==='li'){if(!open){h+='<ul>';open=true}h+='<li>'+esc(b.text)+'</li>';continue}if(open){h+='</ul>';open=false}if(b.type==='h2')h+='<h3>'+esc(b.text)+'</h3>';else if(b.type==='caption')h+='<p class="caption">'+esc(b.text)+'</p>';else if(b.type==='table')h+=table(b.rows);else h+='<p>'+esc(b.text||'')+'</p>'}if(open)h+='</ul>';return h}
function visual(v){if(!v)return'';const steps=v[1];return'<div class="visual-grid"><div class="live-visual reveal"><div class="visual-title"><h3>'+esc(v[0])+'</h3><span>ANİMASYONLU KONU DİYAGRAMI</span></div><div class="flow">'+steps.map((s,i)=>'<div class="node" style="--d:'+i*90+'ms"><b>'+esc(s)+'</b><span>'+(i===0?'Başlangıç / girdi':'Aşama '+(i+1))+'</span></div>'+(i<steps.length-1?'<div class="arrow">→</div>':'')).join('')+'</div><div class="visual-note">Kavramsal anlatımdır; kesin mühendislik çizimi, P&amp;ID, SLD, ürün seçimi veya sertifikasyon kanıtı değildir.</div></div><figure class="chapter-photo reveal"><img src="'+v[2]+'" alt="'+esc(v[0])+'"><figcaption class="cap">KAYAŞ konsept görseli · ilgili bölüm için görsel bağlam · uygulama projesi değildir.</figcaption></figure></div>'}
function reveal(){requestAnimationFrame(()=>document.querySelectorAll('.reveal,.reader,.chapter-photo,.live-visual').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'),Math.min(i,10)*45)))}
function start(){const g=window.KAYAS_GUIDE;if(!g||!Array.isArray(g.chapters)){document.getElementById('body').innerHTML='<p>Rehber verisi yüklenemedi. Lütfen sayfayı yenileyin.</p>';return}const nav=document.getElementById('nav'),body=document.getElementById('body'),title=document.getElementById('title'),kicker=document.getElementById('kicker'),primer=document.getElementById('primer'),vis=document.getElementById('visual'),q=document.getElementById('q');let idx=Math.max(0,g.chapters.findIndex(c=>c.id==='01')),filter='';function visible(){const f=filter.toLocaleLowerCase('tr-TR');return g.chapters.filter(c=>!f||(c.title+' '+c.blocks.map(b=>b.text||((b.rows||[]).flat().join(' '))).join(' ')).toLocaleLowerCase('tr-TR').includes(f))}function navBuild(){nav.innerHTML='';for(const c of visible()){const i=g.chapters.indexOf(c),b=document.createElement('button');b.className=i===idx?'active':'';b.innerHTML='<b>'+esc(c.id)+'</b><span>'+esc(c.title)+'</span>';b.onclick=()=>{idx=i;render();document.querySelector('.reader').scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)}}function render(){const c=g.chapters[idx],p=PR[c.id]||generic(c);kicker.textContent=(c.kind==='appendix'?'Ek':'Bölüm')+' '+c.id.replace('EK-','');title.textContent=c.title;primer.innerHTML='<div class="primer-head"><h3>Konuya hızlı giriş</h3><span class="eyebrow">TEMEL KAVRAMLAR</span></div><div class="primer-grid">'+[['Nedir?',p[0]],['Veri merkezindeki önemi',p[1]],['Başlıca türleri / bileşenleri',p[2]],['Basit çalışma mantığı',p[3]]].map((x,i)=>'<div class="primer-card" style="--d:'+i*80+'ms"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div>').join('')+'</div>';vis.innerHTML=visual(VI[c.id]);body.innerHTML=blocks(c.blocks);navBuild();reveal()}function step(d){const v=visible();let pos=v.findIndex(c=>g.chapters.indexOf(c)===idx);if(pos<0)pos=0;pos=(pos+d+v.length)%v.length;idx=g.chapters.indexOf(v[pos]);render();document.querySelector('.reader').scrollIntoView({behavior:'smooth',block:'start'})}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);q.oninput=()=>{filter=q.value.trim();navBuild()};render()}
