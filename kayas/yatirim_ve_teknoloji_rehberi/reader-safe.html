<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<meta name="theme-color" content="#0d2742" />
<title>KAYAŞ | Yatırım ve Teknoloji Rehberi</title>
<style>
:root{--navy:#102e4a;--teal:#168b91;--cyan:#2b9ab6;--line:#dce6ec;--soft:#f5f8fa;--muted:#617786;--ink:#18334a;--shadow:0 14px 34px rgba(16,46,74,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef3f6;color:var(--ink)}
a{color:inherit}.top{position:sticky;top:0;z-index:40;height:64px;background:#0d2742;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.top strong{font-size:16px}.top small{display:block;color:#b9c9d8;margin-top:2px}.top a{color:#dce9f4;text-decoration:none;font-size:13px}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1540px;margin:0 auto;min-height:calc(100vh - 64px)}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.side h2{margin:4px 8px 12px;font-size:19px;color:var(--navy)}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;margin-bottom:12px}.nav button{width:100%;display:grid;grid-template-columns:44px 1fr;gap:6px;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 8px;color:#536878;cursor:pointer}.nav button:hover,.nav button.active{background:#edf6f7;color:var(--navy)}.nav b{color:var(--teal)}.nav span{line-height:1.35;font-size:12.5px}
.main{padding:26px;min-width:0}.hero,.reader,.notice{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.hero{padding:28px;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.06em}.hero h1{font-size:34px;line-height:1.08;margin:8px 0 10px;color:var(--navy)}.hero p{max-width:900px;line-height:1.65;color:#536878}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:20px}.metric{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,#f7fafb)}.metric b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}.metric span{font-size:11px;color:var(--muted);line-height:1.35}
.notice{padding:14px 16px;margin-bottom:20px;background:#f3fbfb;border-color:#cfe8e8}.notice strong{color:#0f747a}.reader{overflow:hidden}.reader-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.reader-head h2{margin:4px 0 0;color:var(--navy);font-size:27px}.actions{display:flex;gap:8px}.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.actions button:hover{background:#f4f8fa}.primer{padding:18px 24px 0}.primer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.primer-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#f9fbfc;min-height:128px}.primer-card b{display:block;color:var(--navy);font-size:12px;margin-bottom:7px}.primer-card p{margin:0;color:#566b7b;font-size:12px;line-height:1.5}.body{padding:22px 24px 34px}.body h3{color:var(--navy);font-size:20px;margin:28px 0 10px}.body p{font-size:14px;line-height:1.7;color:#43596b}.body ul{line-height:1.65}.caption{font-size:11px!important;color:#7c8e9b!important;font-style:italic}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0 22px}.table-wrap table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}.table-wrap th,.table-wrap td{padding:10px 12px;border-bottom:1px solid #e8eef2;vertical-align:top;line-height:1.45}.table-wrap th{background:#f0f6f8;color:var(--navy);text-align:left;position:sticky;top:0}.error{padding:34px;text-align:center}.error h2{color:#8b2635}.auth-card{max-width:680px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);text-align:center}.auth-card h1{color:var(--navy)}.auth-card a{display:inline-block;margin-top:10px;padding:11px 16px;border-radius:10px;background:var(--navy);color:white;text-decoration:none}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .65s cubic-bezier(.22,.88,.22,1)}.reveal.visible{opacity:1;transform:none}@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.primer-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:relative;top:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}.primer-grid{grid-template-columns:1fr}.hero h1{font-size:28px}.reader-head{align-items:flex-start;flex-direction:column}}@media print{.top,.side,.actions,.notice{display:none!important}.shell{display:block}.main{padding:0}.hero,.reader{box-shadow:none;border:0}.reveal{opacity:1!important;transform:none!important}.table-wrap{overflow:visible}.table-wrap table{min-width:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const AUTH_KEY='kayas_walkthrough_auth_until';
  let auth=0;try{auth=Number(localStorage.getItem(AUTH_KEY)||0);}catch(_){auth=0;}
  if(auth<=Date.now()){
    document.getElementById('app').innerHTML='<div class="auth-card"><div class="eyebrow">KAYAŞ INVESTOR PORTAL</div><h1>Rehber erişimi portal oturumu gerektiriyor</h1><p>Bu sayfa KAYAŞ portalının kontrollü rehber alanıdır. Önce ana portala giriş yapın, ardından Yatırım Rehberi bağlantısını açın.</p><a href="../">KAYAŞ ana portalına dön</a></div>';
    return;
  }
  document.getElementById('app').innerHTML='<header class="top"><div><strong>KAYAŞ · Yatırım ve Teknoloji Rehberi</strong><small>Stabil web reader · v4.4 içerik tabanı</small></div><a href="../">← KAYAŞ ana portalı</a></header><div class="shell"><aside class="side"><div class="eyebrow">KAYAŞ-DC-GUIDE</div><h2>İçindekiler</h2><input id="q" class="search" type="search" placeholder="Bölüm veya teknoloji ara…"><nav id="nav" class="nav"></nav></aside><main class="main"><section class="hero reveal"><div class="eyebrow">KAYAŞ VERİ MERKEZİ</div><h1>Yatırım, tasarım, teknoloji ve gelecek için karar rehberi</h1><p>Teknik açıklamalar, yatırım karar sınıfları, kaynak notları ve açık kanıt kapıları aynı okunabilir yüzeyde sunulur.</p><div class="metrics"><div class="metric"><b data-count="206">206</b><span>Faz-1 IT kabinet</span></div><div class="metric"><b>1.972 MW</b><span>IT nameplate ön fizibilite</span></div><div class="metric"><b>7 kW</b><span>Standart kabinet</span></div><div class="metric"><b>10</b><span>AI/HPC sıvı soğutmalı kabinet</span></div><div class="metric"><b>≈2.000</b><span>Uzun vadeli vizyon</span></div><div class="metric"><b>Tier III</b><span>Hedef; sertifika değildir</span></div></div></section><section class="notice reveal"><strong>Stabil sürüm:</strong> Bu reader, ana portalın mevcut guide-data.js içeriğini doğrudan okur; görsel/animasyon katmanlarından biri hata verse bile bölüm metni ve tablolar görünür kalır.</section><section class="reader reveal"><div class="reader-head"><div><div class="eyebrow" id="kicker">Bölüm 01</div><h2 id="title">Yatırım ve Pazar Görünümü</h2></div><div class="actions"><button id="prev">← Önceki</button><button id="next">Sonraki →</button></div></div><div id="primer" class="primer"></div><article id="body" class="body"><p>Rehber verisi yükleniyor…</p></article></section></main></div>';

  const PRIMERS={
    '01':['Veri merkezi yatırımı; fiziksel tesis, enerji, bağlantı, IT platformları ve işletme kabiliyetinin birlikte ekonomik değer üretmesidir.','Yatırım başarısı bina veya kabinet sayısından çok kullanılabilir güç, satılabilir kW/MW, doluluk, SLA ve müşteri talebiyle ölçülür.','Colocation, enterprise/private DC, hyperscale/wholesale, cloud ve managed-service modelleri.','Enerji ve saha hazırlanır → MEP/IT kurulur → kapasite sözleşmeyle tahsis edilir → operasyon ve SLA üzerinden gelir üretilir.'],
    '03':['Şebekeden IT rack’ine kadar elektriğin güvenli, seçici, ölçülebilir ve yedekli biçimde taşındığı güç zinciridir.','Güç yolu tasarımı satılabilir MW, Tier hedefi, bakım ve arıza etkisini belirler.','OG/AG giriş, trafo, şalt, UPS, jeneratör, PDU/busway, rack PDU, A/B yol ve ölçüm.','Şebeke enerjisi dağıtılır → UPS kısa kesintiyi köprüler → jeneratör uzun kesintide yükü devralır → A/B yollar IT yükünü besler.'],
    '04':['UPS, şebeke bozulması veya kesilmesi sırasında kritik IT yükünü kesintisiz besleyen güç elektroniği sistemidir.','Milisaniye seviyesindeki kesintilerin sunucu, storage ve ağ cihazlarını durdurmasını önler; jeneratör devreye girene kadar ride-through sağlar.','Static double-conversion UPS, modular UPS ve rotary/DRUPS; depolamada VRLA, Li-ion/LFP veya kinetik çözümler.','Şebeke normalde yükü besler → kesintide inverter depolamadan devam eder → jeneratör stabil olunca uzun süreli kaynak devralır.'],
    '06':['Enerjinin batarya veya başka depolama teknolojileriyle daha sonra kullanılmak üzere saklanmasıdır.','UPS bataryası kısa süreli kesintisizliğe, BESS ise enerji esnekliği, peak shaving ve farklı şebeke/enerji kullanım senaryolarına hizmet eder.','VRLA, Li-ion/LFP UPS bataryaları; cabinet/container BESS, PCS/inverter, BMS ve EMS.','Sistem şarj olur → SoC ve güvenlik izlenir → ihtiyaçta inverter üzerinden yük veya şebekeye kontrollü güç verir.'],
    '08':['IT ekipmanının ürettiği ısının hava, su veya dielektrik sıvı üzerinden uzaklaştırılması sürecidir.','Enerji tüketimi, rack yoğunluğu, PUE/WUE, IT güvenilirliği ve AI/HPC kapasitesini belirleyen ana MEP sistemidir.','In-row/CRAH/CRAC, chiller, dry/adiabatic cooling, rear-door HX, direct-to-chip + CDU ve immersion.','IT ısısı kapalı devreye aktarılır → eşanjör/chiller ısıyı dışarı atar → soğutulmuş akışkan IT tarafına döner; doğal su doğrudan IT devresine bağlanmaz.'],
    '09':['Operatörler, internet, müşteriler ve rack/fabric arasında yüksek hızlı optik bağlantı sağlayan fiziksel ve mantıksal ağ katmanıdır.','Carrier çeşitliliği, düşük gecikme, cloud/colo ürünleri ve AI fabric kapasitesi fiber ve network tasarımına bağlıdır.','MMR, carrier cross-connect, ODF, spine-leaf, EVPN/VXLAN, OOB; 100G/400G/800G ve gelişen 1.6T.','Carrier fiberi bağımsız güzergâhlardan MMR’a gelir → core/spine’e bağlanır → leaf üzerinden compute/storage/rack’lere dağıtılır.'],
    '10':['Compute, storage ve network kaynaklarının yazılım, otomasyon ve self-service katmanıyla hizmet olarak sunulmasıdır.','Fiziksel kapasiteyi daha yüksek katma değerli IaaS/private cloud/managed hizmet gelirine dönüştürür.','Private cloud, hybrid cloud, managed cloud; IaaS, PaaS, DBaaS ve container/Kubernetes servisleri.','Kaynaklar havuzlanır → cloud yönetimi katalog/quota/workflow uygular → tenant portalı kaynak tüketir → metering/SLA ile hizmet yönetilir.'],
    '11':['Müşterinin IT ekipmanını üçüncü taraf veri merkezinde güç, soğutma, bağlantı ve güvenlik hizmetleriyle barındırmasıdır.','Gelir rack sayısından çok contracted kW/MW, bağlantı, SLA ve ek hizmetlerden oluşur.','Retail colo, wholesale/dedicated hall, cage/private suite, cross-connect, remote hands ve managed services.','Müşteriye alan + güç + bağlantı tahsis edilir → tesis sürekliliği sağlar → SLA, ölçüm ve destek hizmetleri faturalandırılır.'],
    '12':['Tiering dayanıklılık/topoloji seviyesini, standartlar gereklilikleri, commissioning ise kurulan sistemlerin birlikte doğrulanmasını tanımlar.','Yedekli ekipman tek başına güvenilir tesis üretmez; tasarım, kurulum, test ve operasyon kanıtı gerekir.','Uptime Tier I–IV, ANSI/TIA-942, EN 50600/TS EN 50600; FAT, SAT, IST ve ORR.','Gereksinim tasarıma çevrilir → FAT/SAT doğrular → IST arıza/geçiş senaryolarını sınar → operasyon ekibine kontrollü devredilir.'],
    '13':['Compute işlem gücünü, storage veriyi, HCI ise compute + software-defined storage + virtualization kaynaklarını node’larda birleştirir.','Cloud, sanallaştırma, veri tabanı ve enterprise uygulamaların performans, kapasite ve failure-domain temelini oluşturur.','Rack server, modular compute, SAN/NAS/object/SDS ve 2/3/4+ node HCI cluster.','CPU/RAM/disk kaynakları havuzlanır → sanallaştırma iş yüklerini çalıştırır → veri node’lara dağıtılır/replike edilir → yeni node ile kapasite büyür.'],
    '15':['Backup geri getirilebilir veri kopyasıdır; Disaster Recovery kritik hizmeti büyük kesinti veya site kaybı sonrası yeniden çalıştırma kabiliyetidir.','Ransomware, kullanıcı hatası, donanım arızası ve site felaketlerinde veri ve iş sürekliliğinin son savunma katmanıdır.','Full/incremental backup, immutable/object-lock, offline/air-gap, replication, remote DR ve cloud backup.','Veri kopyalanır → en az bir kopya değiştirilemez tutulur → restore test edilir → felakette RPO/RTO hedeflerine göre DR devreye alınır.'],
    '18':['AI/GPU cluster, çok sayıda GPU sunucusunun yüksek hızlı fabric, yüksek performanslı storage ve yoğun güç/soğutma altyapısıyla tek küme olarak çalışmasıdır.','AI training ve büyük inference iş yükleri klasik enterprise rack yoğunluğunun üzerine çıkarak elektrik, cooling ve fiber tasarımını birlikte değiştirir.','GPU compute node, yüksek hızlı fabric, parallel storage, scheduler/orchestration, direct-to-chip/CDU ve high-density power zone.','Veri storage’dan GPU node’larına taşınır → GPU’lar fabric üzerinden paralel hesaplar → scheduler kaynakları paylaştırır → güç/soğutma telemetrisi yoğunluğu kontrol eder.'],
    '21':['Kuantum hesaplama belirli problemlerde klasik bilgisayarlardan farklı kuantum durumlarını kullanan bir hesaplama yaklaşımıdır; post-quantum cryptography ise kuantum tehdidine dayanıklı kriptografi hazırlığıdır.','Kuantum donanımı bugün niş/araştırma alanıdır; PQC ve crypto-agility ise bugünden planlanması gereken güvenlik mimarisidir.','Superconducting/ion/photonic quantum yaklaşımları; PQC algoritmaları, crypto inventory ve crypto-agility.','Kuantum sistemleri özel fiziksel koşullarda çalışır; kurumlar ise mevcut şifreleme envanterini çıkarıp PQC geçişini kontrollü biçimde planlar.']
  };
  const generic=(c)=>['Bu bölüm, '+c.title+' konusunun veri merkezi mimarisi ve yatırım kararındaki rolünü açıklar.','Konu; süreklilik, kapasite, maliyet, operasyon veya müşteri hizmet kalitesinden en az birini doğrudan etkiler.','Başlıca türler ve bileşenler bölüm içindeki teknik karşılaştırma ve tablolarda sınıflandırılmıştır.','Temel çalışma mantığı; girdinin ilgili altyapı/servis katmanında işlenmesi, izlenmesi ve güvenilir biçimde çıktıya dönüştürülmesidir.'];
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
  function table(rows){if(!rows||!rows.length)return '';return '<div class="table-wrap"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i===0?'<th>':'<td>')+esc(c)+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>';}
  function blocks(list){let h='',open=false;for(const b of list||[]){if(b.type==='li'){if(!open){h+='<ul>';open=true}h+='<li>'+esc(b.text)+'</li>';continue}if(open){h+='</ul>';open=false}if(b.type==='h2')h+='<h3>'+esc(b.text)+'</h3>';else if(b.type==='caption')h+='<p class="caption">'+esc(b.text)+'</p>';else if(b.type==='table')h+=table(b.rows);else h+='<p>'+esc(b.text||'')+'</p>';}if(open)h+='</ul>';return h;}
  function start(){
    const g=window.KAYAS_GUIDE;if(!g||!Array.isArray(g.chapters)){document.getElementById('body').innerHTML='<div class="error"><h2>Rehber verisi yüklenemedi</h2><p>guide-data.js dosyası bulunamadı veya geçersiz.</p></div>';return}
    const nav=document.getElementById('nav'),body=document.getElementById('body'),title=document.getElementById('title'),kicker=document.getElementById('kicker'),primer=document.getElementById('primer'),q=document.getElementById('q');
    let idx=Math.max(0,g.chapters.findIndex(c=>c.id==='01')),filter='';
    function visible(){const f=filter.toLocaleLowerCase('tr-TR');return g.chapters.filter(c=>!f||(c.title+' '+c.blocks.map(b=>b.text||((b.rows||[]).flat().join(' '))).join(' ')).toLocaleLowerCase('tr-TR').includes(f));}
    function navBuild(){nav.innerHTML='';for(const c of visible()){const i=g.chapters.indexOf(c),b=document.createElement('button');b.className=i===idx?'active':'';b.innerHTML='<b>'+esc(c.id)+'</b><span>'+esc(c.title)+'</span>';b.onclick=()=>{idx=i;render();window.scrollTo({top:0,behavior:'smooth'})};nav.appendChild(b)}}
    function render(){const c=g.chapters[idx];kicker.textContent=(c.kind==='appendix'?'Ek':'Bölüm')+' '+c.id.replace('EK-','');title.textContent=c.title;const p=PRIMERS[c.id]||generic(c);primer.innerHTML='<div class="primer-grid">'+[['Nedir?',p[0]],['Veri merkezindeki önemi',p[1]],['Başlıca türleri / bileşenleri',p[2]],['Basit çalışma mantığı',p[3]]].map(x=>'<div class="primer-card reveal"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div>').join('')+'</div>';body.innerHTML=blocks(c.blocks);navBuild();reveal()}
    function step(d){const v=visible();let pos=v.findIndex(c=>g.chapters.indexOf(c)===idx);if(pos<0)pos=0;pos=(pos+d+v.length)%v.length;idx=g.chapters.indexOf(v[pos]);render()}
    document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);q.oninput=()=>{filter=q.value.trim();navBuild()};render();
  }
  function reveal(){document.querySelectorAll('.reveal').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'),Math.min(i,8)*55));}
  const s=document.createElement('script');s.src='guide-data.js?v=20260808-safe1';s.onload=start;s.onerror=()=>{document.getElementById('body').innerHTML='<div class="error"><h2>Rehber verisi yüklenemedi</h2><p>guide-data.js erişimi başarısız.</p></div>'};document.body.appendChild(s);reveal();
})();
</script>
</body>
</html>
