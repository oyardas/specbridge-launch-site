9" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">•</text><text x="714" y="335" font-size="14" fill="#22384d" font-weight="700" text-anchor="middle">Dijital imza</text><circle cx="859" cy="292" r="25" fill="#1667b8" stroke="#1667b8" stroke-width="1"/><text x="859" y="299" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">•</text><text x="859" y="335" font-size="14" fill="#22384d" font-weight="700" text-anchor="middle">Kod imzalama</text><circle cx="1018" cy="195" r="25" fill="#1667b8" stroke="#1667b8" stroke-width="1"/><text x="1018" y="202" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">✓</text><text x="1054" y="201" font-size="15" fill="#22384d" font-weight="600" text-anchor="start">Kriptografik envanter</text><circle cx="1018" cy="233" r="25" fill="#1667b8" stroke="#1667b8" stroke-width="1"/><text x="1018" y="240" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">✓</text><text x="1054" y="239" font-size="15" fill="#22384d" font-weight="600" text-anchor="start">Crypto-agility</text><circle cx="1018" cy="271" r="25" fill="#1667b8" stroke="#1667b8" stroke-width="1"/><text x="1018" y="278" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">✓</text><text x="1054" y="277" font-size="15" fill="#22384d" font-weight="600" text-anchor="start">Hibrit / PQC geçiş planı</text><circle cx="1018" cy="309" r="25" fill="#1667b8" stroke="#1667b8" stroke-width="1"/><text x="1018" y="316" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">✓</text><text x="1054" y="315" font-size="15" fill="#22384d" font-weight="600" text-anchor="start">Uzun ömürlü verilerin korunması</text><rect x="52" y="365" width="1387" height="300" rx="12" fill="#ffffff" stroke="#d7e3ed" stroke-width="1"/><rect x="52" y="365" width="390" height="44" rx="12" fill="#445466" stroke="#445466" stroke-width="0"/><rect x="442" y="365" width="690" height="44" rx="0" fill="#1667b8" stroke="#1667b8" stroke-