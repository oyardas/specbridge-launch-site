<style>
:root{--navy:#102e4a;--navy2:#0d2742;--teal:#168b91;--cyan:#2b9ab6;--blue:#2f76b8;--line:#dbe6ec;--soft:#f4f8fa;--muted:#607586;--ink:#17334a;--ok:#2a9d67;--warn:#c5861f;--shadow:0 14px 34px rgba(16,46,74,.08);--ease:cubic-bezier(.22,.88,.22,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef3f6;color:var(--ink)}a{color:inherit}.top{position:sticky;top:0;z-index:50;height:64px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 18px rgba(0,0,0,.14)}.top strong{font-size:15px}.top small{display:block;color:#b9c9d8;margin-top:2px}.top a{color:#dce9f4;text-decoration:none;font-size:12px}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1540px;margin:auto;min-height:calc(100vh - 64px)}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.side h2{margin:4px 8px 12px;font-size:19px;color:var(--navy)}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;margin-bottom:12px}.nav button{width:100%;display:grid;grid-template-columns:44px 1fr;gap:6px;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 8px;color:#536878;cursor:pointer}.nav button:hover,.nav button.active{background:#edf6f7;color:var(--navy)}.nav b{color:var(--teal)}.nav span{line-height:1.35;font-size:12.3px}.main{padding:26px;min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.hero{padding:28px;margin-bottom:20px;overflow:hidden}.eyebrow{font-size:10px;font-weight:850;color:var(--teal);letter-spacing:.065em}.hero h1{font-size:34px;line-height:1.08;margin:8px 0 10px;color:var(--navy)}.hero p{max-width:900px;line-height:1.65;color:#536878}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:20px}.metric{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,#f7fafb)}.metric b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}.metric span{font-size:11px;color:var(--muted)}.notice{padding:13px 15px;margin:0 0 20px;background:#f2fbfb;border:1px solid #cfe7e7;border-radius:14px;font-size:12px;color:#45606e}.notice strong{color:#0f747a}.reader{overflow:hidden}.reader-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.reader-head h2{margin:4px 0 0;color:var(--navy);font-size:27px}.actions{display:flex;gap:8px}.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.actions button:hover{background:#f4f8fa}.primer{padding:18px 24px 0}.primer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.primer-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#f9fbfc;min-height:130px}.primer-card b{display:block;color:var(--navy);font-size:12px;margin-bottom:7px}.primer-card p{margin:0;color:#566b7b;font-size:12px;line-height:1.5}.visual-wrap{padding:18px 24px 0}.live-visual{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,#f6fafb);padding:18px;overflow:hidden}.visual-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.visual-title h3{margin:0;color:var(--navy);font-size:19px}.visual-title span{font-size:10px;color:var(--teal);font-weight:800}.flow{display:flex;align-items:stretch;gap:9px;overflow-x:auto;padding:4px 2px 8px}.node{flex:1 1 0;min-width:128px;border:1px solid #d9e5eb;border-radius:14px;padding:13px;background:#fff;position:relative;opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .7s var(--ease);transition-delay:var(--delay,0ms)}.live-visual.visible .node{opacity:1;transform:none}.node b{display:block;color:var(--navy);font-size:12px;margin-bottom:5px}.node span{display:block;color:#647988;font-size:10.5px;line-height:1.4}.arrow{flex:0 0 24px;display:grid;place-items:center;color:var(--cyan);font-size:22px;font-weight:900;animation:arrow 1.5s ease-in-out infinite}.triplet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.visual-caption{margin:11px 2px 0;font-size:11px;line-height:1.45;color:#6a7f8d}.gallery-shot{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#eaf1f4;max-height:360px}.gallery-shot img{display:block;width:100%;height:100%;max-height:360px;object-fit:cover;opacity:0;filter:saturate(.92);transition:opacity .8s ease .25s}.live-visual.visible .gallery-shot img{opacity:1}.body{padding:22px 24px 34px}.body h3{color:var(--navy);font-size:20px;margin:28px 0 10px}.body p{font-size:14px;line-height:1.7;color:#43596b}.body ul{line-height:1.65}.caption{font-size:11px!important;color:#7c8e9b!important;font-style:italic}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0 22px}.table-wrap table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}.table-wrap th,.table-wrap td{padding:10px 12px;border-bottom:1px solid #e8eef2;vertical-align:top;line-height:1.45}.table-wrap th{background:#f0f6f8;color:var(--navy);text-align:left;position:sticky;top:0}.auth{max-width:680px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);text-align:center}.auth h1{color:var(--navy)}.auth a{display:inline-block;margin-top:10px;padding:11px 16px;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none}.reveal{opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .65s var(--ease)}.reveal.visible{opacity:1;transform:none}@keyframes arrow{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(5px);opacity:1}}@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.primer-grid{grid-template-columns:repeat(2,1fr)}.triplet{grid-template-columns:1fr}}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:relative;top:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}.primer-grid{grid-template-columns:1fr}.hero h1{font-size:28px}.reader-head{align-items:flex-start;flex-direction:column}}@media print{.top,.side,.actions,.notice{display:none!important}.shell{display:block}.main{padding:0}.panel{box-shadow:none;border:0}.reveal,.node,.gallery-shot img{opacity:1!important;transform:none!important}.arrow{animation:none}.table-wrap{overflow:visible}.table-wrap table{min-width:0}}
</style>

<body><div id="app"></div>

<script>
(function(){
const KEY='kayas_walkthrough_auth_until';let until=0;try{until=Number(localStorage.getItem(KEY)||0)}catch(_){until=0}if(until<=Date.now()){document.getElementById('app').innerHTML='<div class="auth"><div class="eyebrow">KAYAŞ INVESTOR PORTAL</div><h1>Portal oturumu gerekli</h1><p>Önce KAYAŞ ana portalına giriş yapın. Ardından Yatırım Rehberi bağlantısını tekrar açın.</p><a href="../">KAYAŞ ana portalına dön</a></div>';return}
document.getElementById('app').innerHTML='<header class="top"><div><strong>KAYAŞ · Görsel Yatırım ve Teknoloji Rehberi</strong><small>v4.4 içerik + canlı açıklayıcı görseller</small></div><a href="../">← KAYAŞ ana portalı</a></header><div class="shell"><aside class="side"><div class="eyebrow">KAYAŞ-DC-GUIDE</div><h2>İçindekiler</h2><input id="q" class="search" type="search" placeholder="Bölüm veya teknoloji ara…"><nav id="nav" class="nav"></nav></aside><main class="main"><section class="hero panel reveal"><div class="eyebrow">KAYAŞ VERİ MERKEZİ</div><h1>Yatırım, tasarım, teknoloji ve gelecek için görsel karar rehberi</h1><p>Her bölümde temel açıklama, veri merkezindeki önemi, başlıca türleri, basit çalışma mantığı ve konuya özel canlı görsel birlikte sunulur.</p><div class="metrics"><div class="metric"><b>206</b><span>Faz-1 IT kabinet</span></div><div class="metric"><b>1.972 MW</b><span>IT nameplate ön fizibilite</span></div><div class="metric"><b>7 kW</b><span>Standart kabinet</span></div><div class="metric"><b>10</b><span>AI/HPC sıvı kabinet</span></div><div class="metric"><b>≈2.000</b><span>Uzun vadeli vizyon</span></div><div class="metric"><b>Tier III</b><span>Hedef; sertifika değildir</span></div></div></section><div class="notice reveal"><strong>Bu sürüm:</strong> Safe reader’ın stabil veri yükleme yapısını korur; son hazırladığımız konu açıklamalarını ve bölüm bazlı animasyonlu görsel katmanını yeniden ekler.</div><section class="reader panel reveal"><div class="reader-head"><div><div class="eyebrow" id="kicker">Bölüm 01</div><h2 id="title">Yatırım ve Pazar Görünümü</h2></div><div class="actions"><button id="prev">← Önceki</button><button id="next">Sonraki →</button></div></div><div id="primer" class="primer"></div><div id="visual" class="visual-wrap"></div><article id="body" class="body"><p>Rehber verisi yükleniyor…</p></article></section></main></div>';
const P=window.KAYAS_RICH_PRIMERS||{};const V=window.KAYAS_RICH_VISUALS||{};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function table(rows){if(!rows||!rows.length)return'';return'<div class="table-wrap"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i===0?'<th>':'<td>')+esc(c)+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>'}
function blocks(list){let h='',open=false;for(const b of list||[]){if(b.type==='li'){if(!open){h+='<ul>';open=true}h+='<li>'+esc(b.text)+'</li>';continue}if(open){h+='</ul>';open=false}if(b.type==='h2')h+='<h3>'+esc(b.text)+'</h3>';else if(b.type==='caption')h+='<p class="caption">'+esc(b.text)+'</p>';else if(b.type==='table')h+=table(b.rows);else h+='<p>'+esc(b.text||'')+'</p>'}if(open)h+='</ul>';return h}
function visual(v){if(!v)return'';let inner='';if(v.cols){inner='<div class="triplet">'+v.cols.map((c,i)=>'<div class="node" style="--delay:'+i*90+'ms"><b>'+esc(c[0])+'</b><span>'+esc(c[1])+'</span><span>'+esc(c[2])+'</span></div>').join('')+'</div>'}else{inner='<div class="flow">'+v.steps.map((s,i)=>'<div class="node" style="--delay:'+i*80+'ms"><b>'+esc(s)+'</b><span>'+(i===0?'Girdi / başlangıç':'Aşama '+(i+1))+'</span></div>'+(i<v.steps.length-1?'<div class="arrow">→</div>':'')).join('')+'</div>'}return'<div class="live-visual reveal"><div class="visual-title"><h3>'+esc(v.title)+'</h3><span>CANLI AÇIKLAYICI GÖRSEL</span></div>'+inner+(v.img?'<div class="gallery-shot"><img src="'+v.img+'" alt="'+esc(v.title)+'"></div>':'')+'<div class="visual-caption">Bu görsel kavramsal anlatım içindir; kesin mühendislik, ürün seçimi veya sertifikasyon kanıtı değildir.</div></div>'}
function start(){const g=window.KAYAS_GUIDE;if(!g||!Array.isArray(g.chapters)){document.getElementById('body').innerHTML='<p>guide-data.js yüklenemedi.</p>';return}const nav=document.getElementById('nav'),body=document.getElementById('body'),title=document.getElementById('title'),kicker=document.getElementById('kicker'),primer=document.getElementById('primer'),vis=document.getElementById('visual'),q=document.getElementById('q');let idx=Math.max(0,g.chapters.findIndex(c=>c.id==='01')),filter='';function visible(){const f=filter.toLocaleLowerCase('tr-TR');return g.chapters.filter(c=>!f||(c.title+' '+c.blocks.map(b=>b.text||((b.rows||[]).flat().join(' '))).join(' ')).toLocaleLowerCase('tr-TR').includes(f))}function navBuild(){nav.innerHTML='';for(const c of visible()){const i=g.chapters.indexOf(c),b=document.createElement('button');b.className=i===idx?'active':'';b.innerHTML='<b>'+esc(c.id)+'</b><span>'+esc(c.title)+'</span>';b.onclick=()=>{idx=i;render();window.scrollTo({top:0,behavior:'smooth'})};nav.appendChild(b)}}function render(){const c=g.chapters[idx];kicker.textContent=(c.kind==='appendix'?'Ek':'Bölüm')+' '+c.id.replace('EK-','');title.textContent=c.title;const p=P[c.id]||['Bu bölüm '+c.title+' konusunu tanımlar.','Konu veri merkezi yatırım, tasarım veya işletme kararını etkiler.','Başlıca türler ve bileşenler bölüm metninde sınıflandırılmıştır.','Girdi ilgili katmanda işlenir, izlenir ve güvenilir çıktıya dönüştürülür.'];primer.innerHTML='<div class="primer-grid">'+[['Nedir?',p[0]],['Veri merkezindeki önemi',p[1]],['Başlıca türleri / bileşenleri',p[2]],['Basit çalışma mantığı',p[3]]].map(x=>'<div class="primer-card reveal"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div>').join('')+'</div>';vis.innerHTML=visual(V[c.id]);body.innerHTML=blocks(c.blocks);navBuild();reveal()}function step(d){const v=visible();if(!v.length)return;let pos=v.findIndex(c=>g.chapters.indexOf(c)===idx);pos=pos<0?0:(pos+d+v.length)%v.length;idx=g.chapters.indexOf(v[pos]);render()}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);q.oninput=()=>{filter=q.value.trim();navBuild()};render()}
function reveal(){requestAnimationFrame(()=>document.querySelectorAll('.reveal').forEach((el,i)=>setTimeout(()=>{el.classList.add('visible');if(el.classList.contains('live-visual'))el.classList.add('visible')},Math.min(i,10)*45)))}
const s=document.createElement('script');s.src='guide-data.js?v=20260808-rich1';s.onload=start;s.onerror=()=>{document.getElementById('body').innerHTML='<p>Rehber veri dosyası yüklenemedi.</p>'};document.body.appendChild(s);reveal();
})();
</script>
