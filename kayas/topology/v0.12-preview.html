<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="author" content="Önder Yardaş">
<title>KAYAS Interactive Architecture · DCTS v0.12.0 Preview</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070c}iframe{display:block;width:100%;height:100%;border:0;background:#03070c}.boot{position:fixed;inset:0;display:grid;place-items:center;color:#9db5c2;font:13px Segoe UI,Arial,sans-serif;background:#03070c;z-index:2}.boot b{color:#58dce8}.boot small{display:block;margin-top:7px;color:#587384;text-align:center}</style>
<script>(function(){const k='kayas_walkthrough_auth_until';let ok=false;try{ok=Number(localStorage.getItem(k)||0)>Date.now()}catch(_){}if(!ok)location.replace('/kayas/');})();</script>
</head>
<body>
<div id="boot" class="boot"><div><b>DCTS v0.12.0</b><small>Loading Premium Interactive Overview Map · WP7…</small></div></div>
<iframe id="viewer" src="viewer-v0.11.9.html#view=T00" title="KAYAS DCTS Interactive Architecture"></iframe>
<script>
const f=document.getElementById('viewer'),boot=document.getElementById('boot');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument;
    const addCss=(href)=>{const x=d.createElement('link');x.rel='stylesheet';x.href=href;d.head.appendChild(x)};
    addCss('v0.12-preview.css?v=20260830-wp7');
    addCss('v0.12-nav.css?v=20260830-wp7');
    addCss('v0.12-polish.css?v=20260830-wp7');
    addCss('v0.12-wp7.css?v=20260830-wp7');
    const js=d.createElement('script');js.src='v0.12-preview.js?v=20260830-wp7';
    js.onload=()=>{
      const polish=d.createElement('script');polish.src='v0.12-polish.js?v=20260830-wp7';
      polish.onload=()=>{
        const wp7=d.createElement('script');wp7.src='v0.12-wp7.js?v=20260830-wp7';
        wp7.onload=()=>{boot.style.display='none'};
        wp7.onerror=()=>{boot.innerHTML='<div>v0.12 WP7 polish layer could not be loaded.<small>The WP6 preview baseline is still available.</small></div>'};
        d.body.appendChild(wp7);
      };
      polish.onerror=()=>{boot.innerHTML='<div>v0.12 polish layer could not be loaded.<small>The preview baseline is still available.</small></div>'};
      d.body.appendChild(polish);
    };
    js.onerror=()=>{boot.innerHTML='<div>v0.12 enhancement could not be loaded.<small>Return to the current topology viewer.</small></div>'};
    d.body.appendChild(js);
  }catch(e){boot.innerHTML='<div>Preview could not be initialized.<small>'+String(e.message||e)+'</small></div>'}
});
</script>
</body>
</html>
