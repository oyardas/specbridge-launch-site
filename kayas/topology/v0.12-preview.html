<script>
const f=document.getElementById('viewer'),boot=document.getElementById('boot');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument;
    const css=d.createElement('link');css.rel='stylesheet';css.href='v0.12-wp8.css?v=20260830-wp8-r1';d.head.appendChild(css);
    const js=d.createElement('script');js.src='v0.12-wp8.js?v=20260830-wp8-r1';
    js.onload=()=>{boot.style.display='none'};
    js.onerror=()=>{boot.innerHTML='<div>WP8 enhancement could not be loaded.<small>The production viewer remains unchanged.</small></div>'};
    d.body.appendChild(js);
  }catch(e){boot.innerHTML='<div>Preview could not be initialized.<small>'+String(e.message||e)+'</small></div>'}
