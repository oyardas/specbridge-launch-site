<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="author" content="Önder Yardaş"><title>KAYAS Interactive Architecture</title></head><body style="margin:0;background:#030a11;color:#dceaf0;font-family:Segoe UI,Arial,sans-serif"><div id="boot" style="display:grid;place-items:center;height:100vh;font-size:14px">Loading KAYAS Interactive Architecture…</div><script>(async()=>{const AUTH_KEY='kayas_walkthrough_auth_until';let ok=false;try{ok=Number(localStorage.getItem(AUTH_KEY)||0)>Date.now()}catch(_){}if(!ok){location.replace('/kayas/');return}const files=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt','payload-09.txt'];const chunks=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=chunks.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in window)){document.getElementById('boot').textContent='This browser does not support the topology loader. Please use a current Chrome, Edge, Firefox or Safari browser.';return}const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const text=await new Response(stream).text();document.open();document.write(text);document.close();})().catch(e=>{document.getElementById('boot').textContent='Topology could not be loaded. Return to /kayas/ and try again.';console.error(e)});</script></body></html>
