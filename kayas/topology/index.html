<html lang="en">
<head>
<meta charset="utf-8">

<title>KAYAS Interactive Architecture · Experience Standard v1</title>
<link rel="stylesheet" href="../kayas-shell.css?v=20260901-es1">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070c}body{display:flex;flex-direction:column}iframe{display:block;flex:1 1 auto;width:100%;height:0;border:0;background:#03070c}.boot{position:fixed;left:0;right:0;top:44px;bottom:0;display:grid;place-items:center;color:#9db5c2;font:13px Segoe UI,Arial,sans-serif;background:#03070c;z-index:9980}.boot b{color:#58dce8}.boot small{display:block;margin-top:7px;color:#587384;text-align:center;line-height:1.5}</style>
<script>(function(){const k='kayas_walkthrough_auth_until';let ok=false;try{ok=Number(localStorage.getItem(k)||0)>Date.now()}catch(_){}if(!ok)location.replace('/kayas/');})();</script>
<script src="../kayas-canonical.js?v=20260901-es1"></script>
<script defer src="../kayas-shell.js?v=20260901-es1"></script>
</head>
<body>
<div id="boot" class="boot"><div><b>K00 · KAYAS MASTER ARCHITECTURE</b><small>Loading 210-cabinet digital-infrastructure architecture and DCTS engineering views…</small></div></div>
<iframe id="viewer" title="KAYAS DCTS Interactive Architecture"></iframe>
<script>
(function(){
 const f=document.getElementById('viewer'),boot=document.getElementById('boot');
 const requested=location.hash||'#view=K00';
 f.src='viewer-v0.11.9.html'+(requested.includes('view=K00')?'#view=T00':requested);
 f.addEventListener('load',()=>{
  try{
   const d=f.contentDocument;
   const css=d.createElement('link');css.rel='stylesheet';css.href='v0.14-service-network.css?v=20260901-es1';d.head.appendChild(css);
   const esCss=d.createElement('link');esCss.rel='stylesheet';esCss.href='kayas-experience-standard.css?v=20260901-es1';d.head.appendChild(esCss);
   const model=d.createElement('script');model.src='v0.14-service-model.js?v=20260901-es1';
   model.onload=()=>{
    const ui=d.createElement('script');ui.src='v0.14-service-ui.js?v=20260901-es1';
    ui.onload=()=>{
     const term=d.createElement('script');term.src='dcts-terminology-v1.js?v=20260901-es1';
     term.onload=()=>{
      const exp=d.createElement('script');exp.src='kayas-experience-standard.js?v=20260901-es1';
      exp.onload=()=>{boot.style.display='none';if(requested.includes('view=K00')){try{f.contentWindow.location.hash='#view=K00';f.contentWindow.dispatchEvent(new HashChangeEvent('hashchange'))}catch(_){}}};
      exp.onerror=()=>{boot.innerHTML='<div>K00 experience layer could not be loaded.<small>The DCTS engineering viewer remains available.</small></div>';setTimeout(()=>boot.style.display='none',1800)};
      d.body.appendChild(exp);
     };
     term.onerror=()=>{boot.innerHTML='<div>DCTS terminology layer could not be loaded.<small>The service-network viewer remains available.</small></div>';setTimeout(()=>boot.style.display='none',1800)};
     d.body.appendChild(term);
    };
    ui.onerror=()=>{boot.innerHTML='<div>Service UI enhancement could not be loaded.<small>The base DCTS viewer remains available.</small></div>';setTimeout(()=>boot.style.display='none',2200)};
    d.body.appendChild(ui);
   };
   model.onerror=()=>{boot.innerHTML='<div>Service model could not be loaded.<small>The base DCTS viewer remains available.</small></div>';setTimeout(()=>boot.style.display='none',2200)};
   d.body.appendChild(model);
  }catch(e){boot.innerHTML='<div>Viewer enhancement could not be initialized.<small>'+String(e.message||e)+'</small></div>'}
 });
})();
</script>
</body>
</html>
