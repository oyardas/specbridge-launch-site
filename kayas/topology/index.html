<body>
<div id="boot" class="boot"><div><b>DCTS v0.12.1</b><small>Loading KAYAS Interactive Architecture · Production Hardening…</small></div></div>
<iframe id="viewer" src="viewer-v0.11.9.html#view=T00" title="KAYAS DCTS Interactive Architecture"></iframe>
<script>
const f=document.getElementById('viewer'),boot=document.getElementById('boot');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument;
    const addCss=(href)=>{const x=d.createElement('link');x.rel='stylesheet';x.href=href;d.head.appendChild(x)};
    addCss('v0.12-wp8.css?v=20260830-v0121-r1');
    addCss('v0.12.1-hardening.css?v=20260830-v0121-r1');
    const wp8=d.createElement('script');wp8.src='v0.12-wp8.js?v=20260830-v0121-r1';
    wp8.onload=()=>{
      const hard=d.createElement('script');hard.src='v0.12.1-hardening.js?v=20260830-v0121-r1';
      hard.onload=()=>{boot.style.display='none'};
      hard.onerror=()=>{boot.innerHTML='<div>DCTS v0.12.1 hardening layer could not be loaded.<small>Return to <a href="/kayas/" style="color:#58dce8">KAYAS</a> and try again.</small></div>'};
      d.body.appendChild(hard);
    };
    wp8.onerror=()=>{boot.innerHTML='<div>DCTS v0.12.0 topology enhancement could not be loaded.<small>Return to <a href="/kayas/" style="color:#58dce8">KAYAS</a> and try again.</small></div>'};
    d.body.appendChild(wp8);
  }catch(e){boot.innerHTML='<div>Topology could not be initialized.<small>'+String(e.message||e)+'</small></div>'}
});
</script>
