<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="author" content="Önder Yardaş">
<title>KAYAS Interactive Architecture</title>
</head>
<body style="margin:0;background:#030a11;color:#dceaf0;font-family:Segoe UI,Arial,sans-serif">
<div id="boot" style="display:grid;place-items:center;height:100vh;font-size:14px">Loading KAYAS Interactive Architecture…</div>
<script>
(async()=>{
  const AUTH_KEY='kayas_walkthrough_auth_until';
  let ok=false;
  try{ok=Number(localStorage.getItem(AUTH_KEY)||0)>Date.now()}catch(_){}
  if(!ok){location.replace('/kayas/');return}
  const r=await fetch('viewer-v0.11.9.html.gz',{cache:'no-store'});
  if(!r.ok)throw new Error('viewer payload');
  if(!('DecompressionStream' in window)){
    document.getElementById('boot').textContent='This browser does not support the topology loader. Please use a current Chrome, Edge, Firefox or Safari browser.';
    return
  }
  const ds=new DecompressionStream('gzip');
  const stream=r.body.pipeThrough(ds);
  const text=await new Response(stream).text();
  document.open();document.write(text);document.close();
})().catch(e=>{
  document.getElementById('boot').textContent='Topology could not be loaded. Return to /kayas/ and try again.';
  console.error(e)
});
</script>
</body>
</html>
