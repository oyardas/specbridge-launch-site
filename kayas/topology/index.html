<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="author" content="Önder Yardaş">
<title>KAYAS Interactive Architecture · DCTS Topology Standard v1.0.2</title>
<link rel="stylesheet" href="../kayas-shell.css?v=20260901-theme1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070c}
body{display:flex;flex-direction:column}
iframe{display:block;flex:1 1 auto;width:100%;height:0;border:0;background:#edf3f7}
.boot{position:fixed;left:0;right:0;top:44px;bottom:0;display:grid;place-items:center;color:#9db5c2;font:13px Segoe UI,Arial,sans-serif;background:#03070c;z-index:9980}
.boot b{color:#58dce8}.boot small{display:block;margin-top:7px;color:#587384;text-align:center;line-height:1.5}
</style>
<script>(function(){const k='kayas_walkthrough_auth_until';let ok=false;try{ok=Number(localStorage.getItem(k)||0)>Date.now()}catch(_){}if(!ok)location.replace('/kayas/');})();</script>
<script src="../kayas-canonical.js?v=20260901-es1"></script>
<script defer src="../kayas-shell.js?v=20260901-theme1"></script>
</head>
<body>
<div id="boot" class="boot"><div><b>K00 · KAYAS MASTER ARCHITECTURE</b><small>Loading DCTS Topology Visual Grammar Standard v1.0.2…</small></div></div>
<iframe id="viewer" title="KAYAS DCTS Interactive Architecture"></iframe>
<script>
(function(){
 const f=document.getElementById('viewer'),boot=document.getElementById('boot');
 let started=false;
 function theme(){return window.KAYAS_THEME?.getEffective?.()||document.documentElement.dataset.sbTheme||'light'}
 function syncTheme(){try{f.contentDocument.documentElement.dataset.sbTheme=theme()}catch(_){}}
 function normalizedHash(){
   const raw=(location.hash||'#view=K00').replace(/^#/,'');
   const p=new URLSearchParams(raw);
   let view=(p.get('view')||'K00').toUpperCase();
   if(view==='K00')view='T00';
   if(!/^T(?:0[0-9]|10)$/.test(view))view='T00';
   p.set('view',view);
   if(!p.has('mode'))p.set('mode','PRESENTATION');
   if(!p.has('lang'))p.set('lang','en');
   if(!p.has('design'))p.set('design','1');
   return '#'+p.toString();
 }
 function start(){
   if(started)return;started=true;
   const c=window.KAYAS_DATA?.capacity;
   if(c)boot.querySelector('small').textContent=`Loading ${c.itCabinetsTotal}-cabinet DCTS topology standard…`;
   f.src='v1-preview.html?prod=topology-std-v102'+normalizedHash();
 }
 f.addEventListener('load',()=>{syncTheme();boot.style.display='none'});
 window.addEventListener('specbridge:theme',syncTheme);
 window.addEventListener('hashchange',()=>{
   try{const target=normalizedHash();if(f.contentWindow.location.hash!==target)f.contentWindow.location.hash=target}catch(_){ }
 });
 if(window.KAYAS_DATA)start();else window.addEventListener('kayas:data',start,{once:true});
 setTimeout(start,1800);
})();
</script>
</body>
</html>
