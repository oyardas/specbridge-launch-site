<script>
(function(){
  try{
    if(Number(localStorage.getItem('kayas_walkthrough_auth_until')||0)<=Date.now()){
      location.replace('/kayas/');
    }
  }catch(_){ location.replace('/kayas/'); }
})();
window.DCTS_VIEWER_BOOT={
  packageBase:'/dcts/viewer/fixtures/kayas',
  engineeringProfile:'/dcts/viewer/fixtures/kayas/engineering-profiles-v2.json'
};
(function(){
  const nativeFetch=window.fetch.bind(window);
  window.fetch=function(input,init){
    if(typeof input==='string'){
      try{
        const u=new URL(input,location.href);
        if(u.pathname==='/dcts/viewer/fixtures/kayas/package-manifest.json'){
          u.searchParams.set('dctsrev','eng-profile-v2-v1a11b');
          return nativeFetch(u.href,init);
        }
        if(u.pathname==='/dcts/viewer/fixtures/kayas/engineering-profiles-v1.json'){
          u.pathname='/dcts/viewer/fixtures/kayas/engineering-profiles-v2.json';
          u.searchParams.set('dctsrev','eng-profile-v2-v1a11b');
          return nativeFetch(u.href,init);
        }
        if(u.pathname==='/dcts/viewer/fixtures/kayas/engineering-profiles-v2.json'){
          u.searchParams.set('dctsrev','eng-profile-v2-v1a11b');
          return nativeFetch(u.href,init);
        }
      }catch(_){ }
    }
    return nativeFetch(input,init);
  };
})();
</script>
