(function(){
 const f=document.getElementById('reviewFrame');
 f.addEventListener('load',async()=>{
  try{
   const d=f.contentDocument;
   const css=d.createElement('link');css.rel='stylesheet';css.href='style.css';d.head.appendChild(css);
   const files=['../rev16-5-3/zone-data-1.js','../rev16-5-3/zone-data-2.js','clean-ui.js','tour-data.js','guided-tour.js'];
   for(const file of files){await new Promise((resolve,reject)=>{const s=d.createElement('script');s.src=file;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)})}
  }catch(e){console.error('KAYAS 3D experience could not initialize',e)}
 });
})();
</script>
